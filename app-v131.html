<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a}button,input,select,textarea{font:inherit}.tap{min-height:48px}.soft{box-shadow:0 14px 35px rgba(15,23,42,.08)}:focus-visible{outline:3px solid #111827;outline-offset:3px}.pill{border-radius:9999px;padding:.35rem .7rem;font-size:.75rem;font-weight:800}.switch{width:46px;height:26px;border-radius:9999px;padding:3px;transition:.2s}.switch>span{display:block;width:20px;height:20px;border-radius:9999px;background:#fff;transition:.2s}.switch.on>span{transform:translateX(20px)}.creator-signature{position:fixed;left:50%;bottom:calc(7px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;pointer-events:none;user-select:none;white-space:nowrap;font-size:10px;line-height:1;color:rgba(100,116,139,.42);background:rgba(248,250,252,.72);border:1px solid rgba(148,163,184,.12);padding:4px 9px;border-radius:9999px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}@media(max-width:768px){.creator-signature{font-size:9px;bottom:calc(5px + env(safe-area-inset-bottom,0px));padding:4px 8px}}

<body><div id="root"></div><div class="creator-signature" aria-hidden="true">Créé par Jérôme BARLETTA</div>
<script type="text/babel">
const {useEffect,useMemo,useRef,useState}=React;
const GOOD=["Bravo ! C’est juste.","Très bien !","Excellent !","Bien joué !","Parfait !"];
const BAD=["Pas cette fois. Regarde la correction.","Bonne tentative. Lis bien l’explication.","Encore un effort, tu progresses."];
const DEFAULT_SETTINGS={mode:"training",instructions:"",timerMinutes:0,generationMode:"balanced",distributionMode:"collective",shuffleQuestions:false,shuffleAnswers:false};
const typeLabel=t=>t==="application"?"Application":t==="procedure"?"Méthode":t==="capability"?"Propriété":t==="reverse"?"Notion":t==="alias"?"Vocabulaire":t==="truefalse"?"Vrai / Faux":"Connaissance";
const difficultyLabel=d=>d==="difficile"?"Difficile":d==="facile"?"Facile":"Moyen";
function shuffleList(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normalizeKey(s){return String(s||"").toLowerCase().replace(/[−–—]/g,"-").replace(/\s+/g," ").trim()}
function mergeSettings(v){return {...DEFAULT_SETTINGS,...(v&&typeof v==="object"?v:{})}}
function formatTime(sec){sec=Math.max(0,Number(sec)||0);return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
async function extractPageText(page){const tc=await page.getTextContent();const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str,x:x.transform?.[4]||0,y:x.transform?.[5]||0})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);const lines=[];let row=[],last=null;for(const it of items){if(last===null||Math.abs(it.y-last)<=2.5)row.push(it);else{if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));row=[it]}last=it.y}if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));return QuizzEngine.normalizeFrench(lines.join("\n"))}
async function extractPdfText(file,onProgress){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[],pages=[];for(let p=1;p<=pdf.numPages;p++){onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);const page=await pdf.getPage(p);pages.push(page);let text=await extractPageText(page);if(text.length<80){const vp=page.getViewport({scale:1.7}),canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const ocr=await Tesseract.recognize(canvas,"fra");text=QuizzEngine.normalizeFrench(ocr.data.text||"")}out.push(`[[PAGE:${p}]]\n${text}`)}let full=out.join("\n\n");let bank=[];try{bank=QuizzEngine.extractKnowledge(full)||[]}catch{}if(bank.length<5){const ocrOut=[];for(let p=1;p<=pages.length;p++){onProgress(`Lecture renforcée : page ${p}/${pages.length}`);const page=pages[p-1],vp=page.getViewport({scale:2}),canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const ocr=await Tesseract.recognize(canvas,"fra");const text=QuizzEngine.normalizeFrench(ocr.data.text||"");ocrOut.push(`[[PAGE:${p}]]\n${text}`)}const ocrFull=ocrOut.join("\n\n");let ocrBank=[];try{ocrBank=QuizzEngine.extractKnowledge(ocrFull)||[]}catch{}if(ocrBank.length>bank.length)full=ocrFull}return full}
async function api(url,opts){const r=await fetch(url,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Une erreur est survenue.");return d}
const loadQuiz=id=>api(`/api/get-quiz?id=${encodeURIComponent(id)}`);
const loadLibrary=async()=>{const d=await api("/api/list-quizzes");return Array.isArray(d.items)?d.items:[]};
const deleteQuiz=id=>api("/api/delete-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
const updateQuizMeta=(id,patch)=>api("/api/update-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,patch})});
const publishQuiz=p=>api("/api/save-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
function studentUrl(id){const u=new URL(location.href);u.pathname="/";u.search="";u.searchParams.set("quiz",id);u.hash="";return u.toString()}
function fileTitle(name){let s=String(name||"").replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/^\s*[0-9]+[A-Za-z][0-9A-Za-z]*\s*/,'').replace(/^\s*chapitre\s*\d+\s*/i,'').replace(/\bchapitre\s*\d+\b/gi,' ').replace(/\b20\d{2}\b/g,' ').replace(/\s+/g,' ').trim().replace(/^[\s·:;,-]+|[\s·:;,-]+$/g,'');return s.slice(0,70)||"Quizz"}
function fmtDate(v){try{return new Date(v).toLocaleString("fr-FR")}catch{return ""}}

function App(){
 const studentId=new URLSearchParams(location.search).get("quiz");
 const [mode,setMode]=useState(studentId?"loading":"teacher");
 const [title,setTitle]=useState("Quizz"),[subject,setSubject]=useState("Mathématiques"),[level,setLevel]=useState(""),[count,setCount]=useState(10),[course,setCourse]=useState(""),[filename,setFilename]=useState("");
 const [settings,setSettings]=useState(DEFAULT_SETTINGS);
 const [busy,setBusy]=useState(""),[error,setError]=useState(""),[notice,setNotice]=useState("");
 const [quiz,setQuiz]=useState([]),[runQuiz,setRunQuiz]=useState([]),[url,setUrl]=useState("");
 const [library,setLibrary]=useState([]),[showAll,setShowAll]=useState(false),[search,setSearch]=useState(""),[statusFilter,setStatusFilter]=useState("active"),[subjectFilter,setSubjectFilter]=useState(""),[levelFilter,setLevelFilter]=useState("");
 const [deleteTarget,setDeleteTarget]=useState(null),[deleting,setDeleting]=useState(false),[manageLibrary,setManageLibrary]=useState(false),[libraryEdit,setLibraryEdit]=useState(null);
 const [editingQuestion,setEditingQuestion]=useState(null),[teacherPreview,setTeacherPreview]=useState(false),[distributionPrompt,setDistributionPrompt]=useState(false);
 const [idx,setIdx]=useState(0),[selected,setSelected]=useState(""),[feedback,setFeedback]=useState(null),[hint,setHint]=useState(false),[answers,setAnswers]=useState({}),[secondsLeft,setSecondsLeft]=useState(null);
 const qrRef=useRef(null);
 const current=runQuiz[idx],score=Object.values(answers).filter(x=>x.correct).length;

 useEffect(()=>{if(studentId){loadQuiz(studentId).then(d=>{setTitle(d.title||"Quizz");setSubject(d.subject||"");setLevel(d.level||"");setSettings(mergeSettings(d.settings));setQuiz(d.questions||[]);setMode("intro")}).catch(e=>{setError(e.message);setMode("error")})}else loadLibrary().then(setLibrary).catch(()=>{})},[]);
 useEffect(()=>{if(mode==="published"&&url&&qrRef.current){qrRef.current.innerHTML="";new QRCode(qrRef.current,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}},[mode,url]);
 useEffect(()=>{if(mode!=="quiz"||!settings.timerMinutes||secondsLeft===null)return;const timer=setInterval(()=>setSecondsLeft(s=>{if(s<=1){clearInterval(timer);setMode("results");return 0}return s-1}),1000);return()=>clearInterval(timer)},[mode,settings.timerMinutes,secondsLeft===null]);

 const subjects=useMemo(()=>[...new Set(library.map(x=>x.subject).filter(Boolean))].sort(),[library]);
 const levels=useMemo(()=>[...new Set(library.map(x=>x.level).filter(Boolean))].sort(),[library]);
 const filtered=useMemo(()=>library.filter(x=>{
   const q=search.toLowerCase().trim();
   if(q&&!String(x.title||"").toLowerCase().includes(q))return false;
   if(subjectFilter&&x.subject!==subjectFilter)return false;
   if(levelFilter&&x.level!==levelFilter)return false;
   if(statusFilter==="active"&&x.archived)return false;
   if(statusFilter==="archived"&&!x.archived)return false;
   return true;
 }),[library,search,subjectFilter,levelFilter,statusFilter]);
 const visible=(manageLibrary||showAll||search||subjectFilter||levelFilter||statusFilter!=="active")?filtered:filtered.slice(0,3);
 const totalQuestions=library.filter(x=>!x.archived).reduce((n,x)=>n+(Number(x.count)||0),0);

 async function refreshLibrary(){try{setLibrary(await loadLibrary())}catch{}}
 async function importFile(e){const f=e.target.files?.[0];if(!f)return;setFilename(f.name);setTitle(fileTitle(f.name));setQuiz([]);setUrl("");setEditingQuestion(null);setError("");setNotice("");try{setBusy("Lecture du document…");const docHint=`[[DOCUMENT]] ${fileTitle(f.name)}\n`;if(f.type==="application/pdf"||/\.pdf$/i.test(f.name))setCourse(docHint+await extractPdfText(f,setBusy));else if(f.type.startsWith("image/")){const r=await Tesseract.recognize(f,"fra");setCourse(docHint+`[[PAGE:1]]\n${QuizzEngine.normalizeFrench(r.data.text||"")}`)}else setCourse(docHint+`[[PAGE:1]]\n${QuizzEngine.normalizeFrench(await f.text())}`);setBusy("")}catch(e){setBusy("");setCourse("");setError(e.message)}}
 async function generate(){setError("");setNotice("");try{if(!course)throw new Error("Importe d’abord ton cours.");setBusy("Analyse pédagogique du cours…");const result=QuizzEngine.buildQuiz(course,count,settings.generationMode||"balanced"),qs=result.questions,audit=result.audit||QuizzEngine.auditQuiz(qs,count),apps=qs.filter(q=>q.type==="application").length;if(!audit.ok)throw new Error("Le contrôle qualité a refusé cette série.");setQuiz(qs);setEditingQuestion(null);const faithfulDirect=settings.generationMode==="faithful"&&Number.isFinite(result.faithfulDirectCount)?result.faithfulDirectCount:null;const faithfulGenerated=faithfulDirect===null?null:Math.max(0,qs.length-faithfulDirect);const faithfulNote=faithfulDirect===null?"":` · ${faithfulDirect} extraite${faithfulDirect>1?"s":""} du PDF · ${faithfulGenerated} générée${faithfulGenerated>1?"s":""} à partir du document`;setNotice(qs.length<count?`${qs.length} questions fiables créées sur ${count} demandées${faithfulNote}. Tu peux les modifier, les dupliquer ou en ajouter avant publication.`:`${qs.length} questions contrôlées · ${apps} applications · ${qs.length-apps} connaissances/méthodes${faithfulNote}.`);setBusy("");setMode("preview");scrollTo(0,0)}catch(e){setBusy("");setError(e.message)}}
 async function publishGenerated(distributionMode){setError("");setDistributionPrompt(false);try{const audit=QuizzEngine.auditQuiz(quiz,count);if(!audit.ok)throw new Error("Le contrôle qualité final a détecté une anomalie.");const nextSettings={...settings,distributionMode,shuffleQuestions:distributionMode==="individual",shuffleAnswers:distributionMode==="individual"};setSettings(nextSettings);setBusy("Publication du quiz…");const d=await publishQuiz({app:"quizz",version:13.1,title,subject,level,settings:nextSettings,createdAt:new Date().toISOString(),questions:quiz});setUrl(studentUrl(d.id));setBusy("");setMode("published");refreshLibrary()}catch(e){setBusy("");setError(e.message)}}

 function addQuestion(type="definition"){
   const isTF=type==="truefalse";
   const q={id:`manual-${Date.now()}`,topic:"ajout manuel",page:1,type,question:"",options:isTF?["Vrai","Faux"]:["","","",""],answer:isTF?"Vrai":"",hint:"",explanation:"",source:"Ajout manuel par l’enseignant",difficulty:"moyen",manual:true};
   setQuiz(list=>[...list,q]);setEditingQuestion(quiz.length);setNotice("Question ajoutée manuellement. Complète-la avant publication.");setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50);
 }
 function removeQuestion(index){setQuiz(list=>list.filter((_,i)=>i!==index));setEditingQuestion(null)}
 function duplicateQuestion(index){setQuiz(list=>{const src=list[index],copy={...src,id:`copy-${Date.now()}-${index}`,question:src.question+" (variante)",options:[...src.options],manual:true};return [...list.slice(0,index+1),copy,...list.slice(index+1)]})}
 function moveQuestion(index,delta){setQuiz(list=>{const j=index+delta;if(j<0||j>=list.length)return list;const a=[...list];[a[index],a[j]]=[a[j],a[index]];return a});setEditingQuestion(null)}
 function updateQuestion(index,patch){setQuiz(list=>list.map((q,i)=>i===index?{...q,...patch}:q))}
 function changeQuestionType(index,type){setQuiz(list=>list.map((q,i)=>{if(i!==index)return q;if(type==="truefalse")return{...q,type,options:["Vrai","Faux"],answer:"Vrai"};if(q.type==="truefalse")return{...q,type,options:["","","",""],answer:""};return{...q,type}}))}
 function updateOption(index,optIndex,value){setQuiz(list=>list.map((q,i)=>{if(i!==index)return q;const old=q.options[optIndex],options=q.options.map((o,j)=>j===optIndex?value:o);return{...q,options,answer:q.answer===old?value:q.answer}}))}
 async function replaceQuestion(index){if(!course){setError("Le cours source n’est pas disponible pour remplacer automatiquement cette question. Tu peux la modifier ou en ajouter une.");return}try{setBusy("Recherche d’une autre question…");const result=QuizzEngine.buildQuiz(course,Math.min(30,Math.max(15,count+5)),settings.generationMode||"balanced");const used=new Set(quiz.map(q=>normalizeKey(q.question)));const candidate=result.generated.find(q=>!used.has(normalizeKey(q.question)))||result.questions.find(q=>!used.has(normalizeKey(q.question)));if(!candidate)throw new Error("Aucune autre question fiable n’a été trouvée dans ce cours.");const fresh={...candidate,id:`replace-${Date.now()}`};setQuiz(list=>list.map((q,i)=>i===index?fresh:q));setEditingQuestion(null);setNotice("Question remplacée par une nouvelle question validée du même cours.");setBusy("")}catch(e){setBusy("");setError(e.message)}}

 function prepareRun(){
   let list=quiz.map(q=>({...q,options:[...q.options]}));
   const individual=settings.distributionMode==="individual";
   if(individual)list=shuffleList(list);
   if(individual)list=list.map(q=>({...q,options:shuffleList(q.options)}));
   return list;
 }
 function startRun(asTeacher=false){setTeacherPreview(asTeacher);setRunQuiz(prepareRun());setIdx(0);setSelected("");setFeedback(null);setHint(false);setAnswers({});setSecondsLeft(settings.timerMinutes?settings.timerMinutes*60:null);setMode("quiz");scrollTo(0,0)}
 function finishOrNext(){if(idx+1>=runQuiz.length){setMode("results");scrollTo(0,0)}else{setIdx(x=>x+1);setSelected("");setFeedback(null);setHint(false);scrollTo(0,0)}}
 function validate(){if(!selected||feedback)return;const ok=selected===current.answer;setAnswers(a=>({...a,[current.id]:{correct:ok,selected}}));if(settings.mode==="evaluation"){finishOrNext()}else setFeedback({correct:ok,text:ok?GOOD[(idx+score)%GOOD.length]:BAD[(idx+score)%BAD.length]})}
 function backToTeacherPreview(){setTeacherPreview(false);setMode("preview");setRunQuiz([]);setAnswers({});setSecondsLeft(null);scrollTo(0,0)}

 async function reopen(item){try{const d=await loadQuiz(item.id);setQuiz(d.questions||[]);setTitle(d.title||item.title);setSubject(d.subject||"");setLevel(d.level||"");setSettings(mergeSettings(d.settings));setUrl(studentUrl(item.id));setMode("published")}catch(e){setError(e.message)}}
 async function duplicateLibraryQuiz(item){try{setBusy("Duplication du quiz…");const d=await loadQuiz(item.id);setQuiz((d.questions||[]).map((q,i)=>({...q,id:`dup-${Date.now()}-${i}`})));setTitle(`${d.title||item.title} - copie`);setSubject(d.subject||item.subject||"");setLevel(d.level||item.level||"");setSettings(mergeSettings(d.settings));setCount((d.questions||[]).length);setCourse("");setUrl("");setNotice("Copie créée. Tu peux la modifier avant de la publier comme nouveau quiz.");setBusy("");setMode("preview");scrollTo(0,0)}catch(e){setBusy("");setError(e.message)}}
 async function toggleArchive(item){try{await updateQuizMeta(item.id,{archived:!item.archived});await refreshLibrary()}catch(e){setError(e.message)}}
 async function saveLibraryEdit(){if(!libraryEdit)return;try{await updateQuizMeta(libraryEdit.id,{title:libraryEdit.title,subject:libraryEdit.subject,level:libraryEdit.level});setLibraryEdit(null);await refreshLibrary()}catch(e){setError(e.message)}}
 async function confirmDelete(){if(!deleteTarget)return;setDeleting(true);try{await deleteQuiz(deleteTarget.id);setLibrary(x=>x.filter(q=>q.id!==deleteTarget.id));setDeleteTarget(null)}catch(e){setError(e.message)}finally{setDeleting(false)}}

 if(mode==="loading")return <main className="min-h-screen grid place-items-center"><div className="font-black text-xl">Chargement du quiz…</div></main>;
 if(mode==="error")return <main className="min-h-screen grid place-items-center p-4"><section className="bg-white rounded-3xl border p-6 soft"><h1 className="text-2xl font-black">Quiz indisponible</h1><p className="mt-2 text-rose-700">{error}</p></section></main>;

 if(mode==="preview"){
   const audit=QuizzEngine.auditQuiz(quiz,count),apps=quiz.filter(q=>q.type==="application").length;
   return <main className="min-h-screen bg-slate-50 p-4"><div className="max-w-5xl mx-auto py-5">
     <button onClick={()=>setMode("teacher")} className="tap font-bold">← Modifier les réglages</button>
     <section className="mt-3 bg-white rounded-[2rem] border p-6 sm:p-7 soft">
       <div className="flex flex-col sm:flex-row sm:justify-between gap-4"><div><div className="text-xs font-black uppercase tracking-[.14em] text-indigo-600">Prévisualisation professeur</div><h1 className="mt-1 text-3xl font-black">{title}</h1><p className="mt-2 text-slate-600">{settings.mode==="evaluation"?"Mode évaluation":"Mode entraînement"} · dernier contrôle avant publication.</p></div><div className={`rounded-2xl px-4 py-3 font-black border ${audit.ok?"bg-emerald-50 text-emerald-800 border-emerald-200":"bg-rose-50 text-rose-800 border-rose-200"}`}>{audit.ok?"✓ Contrôle qualité validé":"⚠ Série à corriger"}</div></div>
       <div className="mt-5 grid sm:grid-cols-3 gap-3"><div className="rounded-2xl bg-slate-50 p-4 text-center"><div className="text-2xl font-black">{quiz.length}</div><div className="text-xs text-slate-500">questions</div></div><div className="rounded-2xl bg-indigo-50 p-4 text-center"><div className="text-2xl font-black text-indigo-800">{apps}</div><div className="text-xs text-indigo-700">applications</div></div><div className="rounded-2xl bg-violet-50 p-4 text-center"><div className="text-2xl font-black text-violet-800">{quiz.length-apps}</div><div className="text-xs text-violet-700">notions / méthodes</div></div></div>
       {notice&&<div className="mt-4 rounded-2xl border border-indigo-200 bg-indigo-50 p-4 text-sm font-bold">{notice}</div>}
       {error&&<div className="mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-4 font-bold text-rose-800">{error}</div>}
       <div className="mt-6 flex flex-wrap gap-2 justify-between"><button type="button" onClick={()=>startRun(true)} className="tap rounded-xl border-2 border-indigo-200 bg-indigo-50 px-4 text-indigo-700 font-black">👁 Prévisualiser comme un élève</button><div className="flex flex-wrap gap-2"><button type="button" onClick={()=>addQuestion("definition")} className="tap rounded-xl bg-emerald-600 px-4 text-white font-black">＋ Ajouter un QCM</button><button type="button" onClick={()=>addQuestion("truefalse")} className="tap rounded-xl bg-emerald-50 border-2 border-emerald-200 px-4 text-emerald-800 font-black">＋ Vrai / Faux</button></div></div>
       <div className="mt-4 space-y-4">{quiz.map((q,i)=>{const editing=editingQuestion===i;return <article key={q.id} className={`rounded-2xl border p-4 sm:p-5 ${editing?"border-indigo-300 bg-indigo-50/30":""}`}>
         <div className="flex flex-wrap items-center justify-between gap-3"><div className="flex flex-wrap gap-2 items-center"><span className="pill bg-slate-100">{i+1}</span><span className="pill bg-indigo-50 text-indigo-700">{typeLabel(q.type)}</span><span className="pill bg-amber-50 text-amber-800">{difficultyLabel(q.difficulty)}</span>{q.manual?<span className="pill bg-slate-50 text-slate-500">Ajout manuel</span>:q.generatedFromTopic?<span className="pill bg-slate-50 text-slate-500">Généré à partir du document</span>:q.page?<span className="pill bg-slate-50 text-slate-500">Extrait du PDF · p. {q.page}</span>:<span className="pill bg-slate-50 text-slate-500">Extrait du document</span>}</div><div className="flex flex-wrap gap-1"><button onClick={()=>moveQuestion(i,-1)} disabled={i===0} className="tap min-h-0 rounded-lg border px-2 py-1 disabled:opacity-30">↑</button><button onClick={()=>moveQuestion(i,1)} disabled={i===quiz.length-1} className="tap min-h-0 rounded-lg border px-2 py-1 disabled:opacity-30">↓</button><button onClick={()=>duplicateQuestion(i)} className="tap min-h-0 rounded-lg border px-2 py-1">Dupliquer</button><button onClick={()=>replaceQuestion(i)} disabled={!course||!!busy} className="tap min-h-0 rounded-lg border px-2 py-1 disabled:opacity-40">Remplacer</button><button onClick={()=>removeQuestion(i)} className="tap min-h-0 rounded-lg bg-rose-50 text-rose-700 px-2 py-1">Supprimer</button><button onClick={()=>setEditingQuestion(editing?null:i)} className={`tap min-h-0 rounded-lg px-3 py-1 font-black ${editing?"bg-slate-900 text-white":"bg-indigo-50 text-indigo-700"}`}>{editing?"✓ Terminer":"✏️ Modifier"}</button></div></div>
         {editing?<div className="mt-4 space-y-4">
           <div className="grid sm:grid-cols-2 gap-3"><label className="text-sm font-black">Type<select value={q.type} onChange={e=>changeQuestionType(i,e.target.value)} className="tap mt-2 w-full rounded-xl border bg-white px-3"><option value="definition">QCM connaissance</option><option value="truefalse">Vrai / Faux</option>{q.type==="application"&&<option value="application">Application</option>}<option value="procedure">Méthode</option></select></label><label className="text-sm font-black">Difficulté<select value={q.difficulty||"moyen"} onChange={e=>updateQuestion(i,{difficulty:e.target.value})} className="tap mt-2 w-full rounded-xl border bg-white px-3"><option value="facile">Facile</option><option value="moyen">Moyen</option><option value="difficile">Difficile</option></select></label></div>
           <label className="block text-sm font-black">Question<textarea value={q.question} onChange={e=>updateQuestion(i,{question:e.target.value})} className="mt-2 w-full min-h-24 rounded-xl border bg-white p-3 font-medium"/></label>
           <div><div className="text-sm font-black mb-2">Réponses · sélectionne la bonne</div><div className="space-y-2">{q.options.map((o,j)=><div key={j} className={`rounded-xl border p-3 ${o===q.answer?"border-emerald-300 bg-emerald-50":"bg-white"}`}><div className="flex gap-3 items-start"><input type="radio" name={`correct-${q.id}`} checked={o===q.answer} onChange={()=>updateQuestion(i,{answer:o})} className="mt-3 w-5 h-5 shrink-0"/>{q.type==="truefalse"?<div className="w-full p-2 font-bold">{o}</div>:<textarea value={o} onChange={e=>updateOption(i,j,e.target.value)} className="w-full min-h-16 rounded-lg border bg-white p-2 text-sm"/>}</div></div>)}</div></div>
           <label className="block text-sm font-black">Explication<textarea value={q.explanation||""} onChange={e=>updateQuestion(i,{explanation:e.target.value})} className="mt-2 w-full min-h-24 rounded-xl border bg-white p-3 font-medium"/></label>
           {q.source&&<details className="rounded-xl border bg-white p-3 text-sm"><summary className="cursor-pointer font-black">Source du cours</summary><p className="mt-2 text-slate-600">{q.source}</p></details>}
         </div>:<><h2 className="mt-3 text-lg font-black">{q.question}</h2><div className={`mt-3 grid ${q.options.length===2?"sm:grid-cols-2":"sm:grid-cols-2"} gap-2 text-sm`}>{q.options.map((o,j)=><div key={j} className={`rounded-xl border p-3 ${o===q.answer?"border-emerald-300 bg-emerald-50 font-bold":"bg-white"}`}>{o===q.answer?"✓ ":""}{o}</div>)}</div><details className="mt-3 text-sm"><summary className="cursor-pointer font-bold text-slate-600">Voir l’explication</summary><p className="mt-2 text-slate-600">{q.explanation||"Aucune explication ajoutée."}</p></details></>}
       </article>})}</div>
       <div className="mt-6 grid sm:grid-cols-3 gap-3"><button onClick={generate} disabled={!!busy||!course} className="tap rounded-2xl border-2 font-black disabled:opacity-40">↻ Régénérer tout</button><button onClick={()=>startRun(true)} disabled={!audit.ok||editingQuestion!==null} className="tap rounded-2xl border-2 border-indigo-200 bg-indigo-50 text-indigo-700 font-black disabled:opacity-40">👁 Tester</button><button onClick={()=>setDistributionPrompt(true)} disabled={!!busy||!audit.ok||editingQuestion!==null} className="tap rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black">{busy?busy:editingQuestion!==null?"Termine la modification":"Publier & créer le QR"}</button></div>
       {distributionPrompt&&<div className="fixed inset-0 z-50 bg-slate-950/50 p-4 grid place-items-center"><section className="w-full max-w-2xl rounded-[2rem] bg-white border p-6 sm:p-7 soft"><div className="text-xs font-black uppercase tracking-[.14em] text-indigo-600">Diffusion du quiz</div><h2 className="mt-1 text-2xl font-black">Comment veux-tu lancer ce QCM ?</h2><p className="mt-2 text-slate-600">Le QR code est le même dans les deux cas. Seul l’ordre du QCM change sur les appareils.</p><div className="mt-6 grid sm:grid-cols-2 gap-4"><button onClick={()=>publishGenerated("collective")} className="rounded-2xl border-2 border-indigo-200 bg-indigo-50 p-5 text-left"><div className="text-3xl">👥</div><div className="mt-2 text-lg font-black text-indigo-800">Collectif</div><p className="mt-1 text-sm text-slate-600">Tous les élèves ont exactement les mêmes questions et les mêmes réponses dans le même ordre. Idéal pour le faire ensemble.</p></button><button onClick={()=>publishGenerated("individual")} className="rounded-2xl border-2 border-emerald-200 bg-emerald-50 p-5 text-left"><div className="text-3xl">👤</div><div className="mt-2 text-lg font-black text-emerald-800">Individuel</div><p className="mt-1 text-sm text-slate-600">Chaque élève reçoit un ordre différent des questions et des réponses. Chacun travaille de son côté.</p></button></div><button onClick={()=>setDistributionPrompt(false)} className="tap mt-5 w-full rounded-xl border font-black">Annuler</button></section></div>}
     </section>
   </div></main>
 }

 if(mode==="intro")return <main className="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-indigo-50 via-white to-fuchsia-50"><section className="w-full max-w-xl bg-white rounded-[2rem] border p-8 text-center soft"><div className="text-xs font-black uppercase tracking-[.16em] text-indigo-700">{settings.mode==="evaluation"?"Évaluation":"Entraînement"}</div><h1 className="mt-2 text-3xl font-black">{title}</h1>{level&&<p className="mt-1 text-sm font-bold text-slate-500">{level}</p>}<p className="mt-3 text-slate-600">{quiz.length} questions{settings.timerMinutes?` · ${settings.timerMinutes} min`:""} · {settings.distributionMode==="individual"?"version individuelle mélangée":"version collective identique"} · bilan final</p>{settings.instructions&&<div className="mt-5 rounded-2xl bg-slate-50 border p-4 text-left"><div className="text-xs font-black uppercase text-slate-500">Consigne</div><p className="mt-1">{settings.instructions}</p></div>}<button onClick={()=>startRun(false)} className="tap mt-7 w-full rounded-2xl bg-indigo-700 text-white font-black text-lg">Commencer</button></section></main>;

 if(mode==="quiz"&&current)return <main className="min-h-screen bg-slate-50">{teacherPreview&&<div className="bg-amber-100 border-b border-amber-200"><div className="max-w-2xl mx-auto px-4 py-2 flex justify-between items-center gap-3 text-sm font-bold"><span>👁 Aperçu professeur</span><button onClick={backToTeacherPreview} className="rounded-lg bg-white border px-3 py-1">Quitter l’aperçu</button></div></div>}<header className="sticky top-0 z-20 bg-white/95 border-b"><div className="max-w-2xl mx-auto p-4"><div className="flex justify-between gap-3 font-black"><span>Question {idx+1}/{runQuiz.length}</span><span className="flex gap-3"><span>{score} juste{score>1?"s":""}</span>{settings.timerMinutes>0&&<span className={secondsLeft<=60?"text-rose-600":""}>⏱ {formatTime(secondsLeft)}</span>}</span></div><div className="mt-2 h-2 rounded-full bg-slate-200"><div className="h-2 rounded-full bg-indigo-600" style={{width:`${Math.round((idx+1)/runQuiz.length*100)}%`}}/></div></div></header><div className="max-w-2xl mx-auto p-4"><section className="rounded-3xl border bg-white p-5 sm:p-7 soft"><div className="text-xs font-black uppercase tracking-[.12em] text-indigo-600">{typeLabel(current.type)} · {difficultyLabel(current.difficulty)}</div><h1 className="mt-2 text-2xl font-black leading-snug">{current.question}</h1>{!feedback&&<><div className="mt-6 space-y-3">{current.options.map((opt,i)=>{const active=selected===opt;return <button key={i} onClick={()=>setSelected(opt)} className={`tap w-full rounded-2xl border-2 p-4 text-left font-bold flex gap-3 ${active?"border-indigo-600 bg-indigo-50":"border-slate-200 bg-white"}`}><span className={`mt-0.5 w-6 h-6 shrink-0 rounded-full border-2 grid place-items-center ${active?"border-indigo-600":"border-slate-300"}`}>{active&&<span className="w-3 h-3 rounded-full bg-indigo-600"/>}</span><span>{opt}</span></button>})}</div>{settings.mode==="training"&&<><button onClick={()=>setHint(x=>!x)} className="tap mt-5 w-full rounded-2xl border-2 border-amber-200 bg-amber-50 font-black">💡 {hint?"Masquer l’indice":"Indice du cours"}</button>{hint&&<div className="mt-3 rounded-2xl border border-amber-200 bg-amber-50 p-4">{current.hint||"Relis la notion correspondante dans le cours."}</div>}</>}<button onClick={validate} disabled={!selected} className="tap mt-3 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black">{settings.mode==="evaluation"?(idx+1===runQuiz.length?"Terminer":"Valider et continuer"):"Valider ma réponse"}</button></>}{feedback&&settings.mode==="training"&&<div className={`mt-6 rounded-3xl border p-5 ${feedback.correct?"bg-emerald-50 border-emerald-200":"bg-rose-50 border-rose-200"}`}><div className="text-lg font-black">{feedback.text}</div>{!feedback.correct&&<p className="mt-3"><strong>Bonne réponse :</strong> {current.answer}</p>}<p className="mt-3"><strong>À retenir :</strong> {current.explanation||current.answer}</p><button onClick={finishOrNext} className="tap mt-5 w-full rounded-2xl bg-slate-900 text-white font-black">{idx+1===runQuiz.length?"Voir mon bilan":"Question suivante"}</button></div>}</section></div></main>;

 if(mode==="results"){const pct=runQuiz.length?Math.round(score/runQuiz.length*100):0,missed=runQuiz.filter(q=>!answers[q.id]?.correct),appQ=runQuiz.filter(q=>q.type==="application"),appScore=appQ.filter(q=>answers[q.id]?.correct).length;return <main className="min-h-screen p-4 bg-gradient-to-br from-emerald-50 via-white to-indigo-50"><div className="max-w-3xl mx-auto">{teacherPreview&&<button onClick={backToTeacherPreview} className="tap mb-3 font-bold">← Retour à la prévisualisation professeur</button>}<section className="bg-white rounded-[2rem] border p-7 text-center soft"><div className="text-sm font-black uppercase tracking-[.14em] text-slate-500">Résultat</div><h1 className="mt-1 text-4xl font-black">{score}/{runQuiz.length}</h1><p className="text-xl font-bold mt-1">{pct}%</p>{appQ.length>0&&<p className="mt-3 text-sm text-slate-600">Applications : <strong>{appScore}/{appQ.length}</strong></p>}</section><section className="mt-5 bg-white rounded-3xl border p-5"><h2 className="text-xl font-black">Points à revoir</h2>{missed.length===0?<p className="mt-4 rounded-2xl bg-emerald-50 p-4 font-bold">Aucune erreur. Bravo !</p>:<div className="mt-4 space-y-3">{missed.map((q,i)=><details key={q.id} className="rounded-2xl border p-4"><summary className="cursor-pointer font-black">{i+1}. {q.question}</summary><p className="mt-2"><strong>Ta réponse :</strong> {answers[q.id]?.selected||"Pas de réponse"}</p><p className="mt-2"><strong>Bonne réponse :</strong> {q.answer}</p><p className="mt-2 text-sm text-slate-600">{q.explanation}</p></details>)}</div>}</section>{teacherPreview?<button onClick={backToTeacherPreview} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Retour à l’éditeur</button>:<button onClick={()=>startRun(false)} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Refaire le quiz</button>}</div></main>}

 if(mode==="published")return <main className="min-h-screen p-4 bg-gradient-to-br from-indigo-50 via-white to-emerald-50"><div className="max-w-3xl mx-auto"><button onClick={()=>setMode("teacher")} className="tap font-bold">← Nouveau quiz</button><section className="mt-3 bg-white rounded-[2rem] border p-7 text-center soft"><div className="text-xs font-black uppercase tracking-[.14em] text-indigo-600">Quiz publié</div><h1 className="mt-2 text-3xl font-black">{title}</h1><p className="mt-2 text-slate-600">{quiz.length} questions · {settings.mode==="evaluation"?"évaluation":"entraînement"} · {settings.distributionMode==="individual"?"individuel mélangé":"collectif identique"} · QR élève prêt</p>{notice&&<div className="mt-4 rounded-2xl border border-indigo-200 bg-indigo-50 p-4 text-sm font-bold">{notice}</div>}<div ref={qrRef} className="mt-6 mx-auto w-[260px] min-h-[260px] grid place-items-center"/><div className="mt-4 rounded-xl bg-slate-50 p-3 text-xs break-all text-slate-500">{url}</div><button onClick={()=>startRun(true)} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Tester le quiz comme un élève</button></section></div></main>;

 return <main className="min-h-screen bg-slate-50"><header className="bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white"><div className="max-w-6xl mx-auto px-4 py-10"><h1 className="mt-3 text-4xl sm:text-5xl font-black">Créer un quiz fiable à partir d’un cours</h1><p className="mt-3 max-w-3xl text-indigo-100">Génération contrôlée, édition professeur, mode entraînement ou évaluation, puis QR élève.</p></div></header><div className="max-w-6xl mx-auto px-4 py-8"><div className="grid lg:grid-cols-[1.3fr_.9fr] gap-6">
   <section className="bg-white rounded-[2rem] border p-6 sm:p-7 soft"><div className="text-xs font-black uppercase tracking-[.14em] text-indigo-600">Nouveau quiz</div><h2 className="mt-1 text-2xl font-black">Importer le cours</h2>
     <label className="mt-6 block rounded-3xl border-2 border-dashed border-indigo-300 bg-indigo-50 p-8 text-center cursor-pointer"><div className="text-4xl">📥</div><div className="mt-3 font-black text-lg">{filename||"Choisir un PDF, une image ou un fichier texte"}</div><input className="sr-only" type="file" accept=".pdf,application/pdf,image/*,.txt,.md,.csv" onChange={importFile}/></label>
     {busy&&<div className="mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-4 font-bold">⏳ {busy}</div>}{course&&!error&&!busy&&<div className="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4 font-bold">✓ Cours importé et prêt.</div>}{error&&<div className="mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-4 font-bold text-rose-800">{error}</div>}
     <div className="mt-6 grid sm:grid-cols-2 gap-4"><label className="font-black text-sm">Nombre de questions<select value={count} onChange={e=>setCount(+e.target.value)} className="tap mt-2 w-full rounded-2xl border px-4 bg-white">{[10,15,20,25,30].map(n=><option key={n}>{n}</option>)}</select></label><label className="font-black text-sm">Titre du quiz<input value={title} onChange={e=>setTitle(e.target.value.slice(0,70))} className="tap mt-2 w-full rounded-2xl border px-4"/></label><label className="font-black text-sm">Matière<input value={subject} onChange={e=>setSubject(e.target.value.slice(0,60))} className="tap mt-2 w-full rounded-2xl border px-4" placeholder="Mathématiques"/></label><label className="font-black text-sm">Niveau / classe<input value={level} onChange={e=>setLevel(e.target.value.slice(0,40))} className="tap mt-2 w-full rounded-2xl border px-4" placeholder="5e, 4e, 2de…"/></label></div>
     <details open className="mt-5 rounded-2xl border bg-slate-50 p-4"><summary className="cursor-pointer font-black">⚙️ Réglages du quiz</summary><div className="mt-4 space-y-4"><div className="grid grid-cols-2 gap-2"><button onClick={()=>setSettings(s=>({...s,mode:"training"}))} className={`tap rounded-xl border-2 font-black ${settings.mode==="training"?"border-indigo-600 bg-indigo-50 text-indigo-700":"bg-white"}`}>🎓 Entraînement</button><button onClick={()=>setSettings(s=>({...s,mode:"evaluation"}))} className={`tap rounded-xl border-2 font-black ${settings.mode==="evaluation"?"border-indigo-600 bg-indigo-50 text-indigo-700":"bg-white"}`}>📝 Évaluation</button></div><p className="text-xs text-slate-500">{settings.mode==="training"?"Indice et correction immédiate après chaque réponse.":"Pas d’indice ni de correction immédiate ; correction dans le bilan final."}</p><div className="rounded-2xl border bg-white p-3"><div className="text-sm font-black">Type de génération</div><div className="mt-2 grid grid-cols-1 gap-2 sm:grid-cols-3"><button onClick={()=>setSettings(s=>({...s,generationMode:"faithful"}))} className={`tap rounded-xl border-2 px-3 text-sm font-black ${settings.generationMode==="faithful"?"border-indigo-600 bg-indigo-50 text-indigo-700":"bg-white"}`}>📄 Au plus près du document</button><button onClick={()=>setSettings(s=>({...s,generationMode:"balanced"}))} className={`tap rounded-xl border-2 px-3 text-sm font-black ${settings.generationMode==="balanced"?"border-indigo-600 bg-indigo-50 text-indigo-700":"bg-white"}`}>⚖️ Équilibré</button><button onClick={()=>setSettings(s=>({...s,generationMode:"inspired"}))} className={`tap rounded-xl border-2 px-3 text-sm font-black ${settings.generationMode==="inspired"?"border-indigo-600 bg-indigo-50 text-indigo-700":"bg-white"}`}>✨ Inspiré du document</button></div><p className="mt-2 text-xs text-slate-500">{settings.generationMode==="faithful"?"Priorité au contenu réellement lisible du PDF ; si nécessaire, le quiz est complété par des questions générées à partir des notions détectées.":settings.generationMode==="inspired"?"Nouvelles questions créées à partir des notions détectées dans le document.":"Mélange de questions proches du document et de questions nouvelles. Recommandé par défaut."}</p></div><label className="block text-sm font-black">Consigne générale<textarea value={settings.instructions} onChange={e=>setSettings(s=>({...s,instructions:e.target.value.slice(0,500)}))} className="mt-2 w-full min-h-20 rounded-xl border bg-white p-3" placeholder="Ex. Lis attentivement chaque question avant de répondre."/></label><label className="block text-sm font-black">Temps limite<select value={settings.timerMinutes} onChange={e=>setSettings(s=>({...s,timerMinutes:+e.target.value}))} className="tap mt-2 w-full rounded-xl border bg-white px-3"><option value="0">Aucun chrono</option>{[5,10,15,20,30,45].map(n=><option value={n} key={n}>{n} minutes</option>)}</select></label><div className="rounded-xl border border-indigo-200 bg-indigo-50 p-3 text-sm text-indigo-900"><strong>Diffusion :</strong> juste avant de créer le QR code, tu choisiras <strong>Collectif</strong> (même QCM pour tous) ou <strong>Individuel</strong> (questions et réponses mélangées différemment sur chaque appareil).</div></div></details>
     <button onClick={generate} disabled={!course||!!busy} className="tap mt-6 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black text-lg">Générer & prévisualiser</button>
     <details className="mt-5 rounded-2xl border bg-slate-50 p-4"><summary className="cursor-pointer font-black text-sm">Option · vérifier le texte récupéré</summary><textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-64 rounded-xl border bg-white p-3 text-sm"/></details>
   </section>
   <aside className="space-y-6">{library.length>0&&<section className="bg-slate-50 rounded-[2rem] border p-5 soft"><div className="flex justify-between gap-3"><div><h2 className="text-lg font-black">Bibliothèque</h2><p className="text-sm text-slate-500">{statusFilter==="archived"?"Quiz archivés":showAll?"Tous les quiz":"Les 3 plus récents"}</p></div><div className="rounded-full bg-indigo-50 px-3 py-1 text-xs font-black text-indigo-700">{library.length}</div></div>
     <button onClick={()=>{setManageLibrary(x=>!x);setShowAll(false)}} className={`tap mt-4 w-full rounded-xl border-2 font-black text-sm ${manageLibrary?"border-slate-300 bg-slate-100 text-slate-800":"border-indigo-200 bg-indigo-50 text-indigo-700"}`}>{manageLibrary?"✓ Terminer la gestion":"⚙️ Gérer les quiz"}</button>
     <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher un titre…" className="tap mt-3 w-full rounded-xl border px-3 text-sm"/>
     <div className="mt-2 grid grid-cols-2 gap-2"><select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className="tap rounded-xl border bg-white px-2 text-sm"><option value="active">Actifs</option><option value="all">Tous</option><option value="archived">Archivés</option></select><select value={subjectFilter} onChange={e=>setSubjectFilter(e.target.value)} className="tap rounded-xl border bg-white px-2 text-sm"><option value="">Toutes matières</option>{subjects.map(s=><option key={s}>{s}</option>)}</select></div>
     {levels.length>0&&<select value={levelFilter} onChange={e=>setLevelFilter(e.target.value)} className="tap mt-2 w-full rounded-xl border bg-white px-2 text-sm"><option value="">Tous niveaux</option>{levels.map(s=><option key={s}>{s}</option>)}</select>}
     <div className="mt-4 space-y-3">{visible.map(item=><div key={item.id} className={`rounded-2xl border p-4 ${item.archived?"bg-slate-50 opacity-80":""}`}><div className="font-black">{item.title}</div><div className="mt-1 text-xs text-slate-500">{item.subject?item.subject+" · ":""}{item.level?item.level+" · ":""}{item.count} questions · {item.mode==="evaluation"?"évaluation":"entraînement"}<br/>{fmtDate(item.createdAt)}</div><div className="mt-3 grid grid-cols-2 gap-2"><button onClick={()=>reopen(item)} className="tap rounded-xl bg-indigo-50 font-black text-sm">QR / ouvrir</button><button onClick={()=>duplicateLibraryQuiz(item)} className="tap rounded-xl bg-emerald-50 text-emerald-800 font-black text-sm">Dupliquer</button>{manageLibrary&&<><button onClick={()=>setLibraryEdit({id:item.id,title:item.title,subject:item.subject||"",level:item.level||""})} className="tap rounded-xl bg-slate-100 font-black text-sm">Renommer</button><button onClick={()=>toggleArchive(item)} className="tap rounded-xl bg-amber-50 text-amber-800 font-black text-sm">{item.archived?"Désarchiver":"Archiver"}</button><button onClick={()=>setDeleteTarget(item)} className="tap col-span-2 rounded-xl bg-rose-50 text-rose-700 font-black text-sm">Supprimer définitivement</button></>}</div></div>)}</div>
     {filtered.length===0&&<div className="mt-4 rounded-xl bg-slate-50 p-4 text-sm text-slate-500">Aucun quiz avec ces filtres.</div>}
     {library.length>3&&!search&&!subjectFilter&&!levelFilter&&statusFilter==="active"&&<button onClick={()=>setShowAll(x=>!x)} className="tap mt-4 w-full rounded-xl border font-black text-sm">{showAll?"Réduire":`Voir les ${filtered.length} quiz`}</button>}
     <div className="mt-4 grid grid-cols-2 gap-2"><div className="rounded-xl bg-slate-50 p-3 text-center"><div className="text-xl font-black">{library.filter(x=>!x.archived).length}</div><div className="text-xs">quiz actifs</div></div><div className="rounded-xl bg-slate-50 p-3 text-center"><div className="text-xl font-black">{totalQuestions}</div><div className="text-xs">questions</div></div></div>
   </section>}</aside>
 </div></div>
 {deleteTarget&&<div className="fixed inset-0 z-50 bg-slate-950/45 p-4 grid place-items-center"><section className="w-full max-w-md rounded-3xl bg-white border p-6 soft"><h2 className="text-xl font-black">Supprimer ce quiz ?</h2><p className="mt-2 text-slate-600">« {deleteTarget.title} » sera supprimé définitivement.</p><div className="mt-6 grid grid-cols-2 gap-3"><button onClick={()=>setDeleteTarget(null)} disabled={deleting} className="tap rounded-xl border font-black">Annuler</button><button onClick={confirmDelete} disabled={deleting} className="tap rounded-xl bg-rose-600 text-white font-black">{deleting?"Suppression…":"Supprimer"}</button></div></section></div>}
 {libraryEdit&&<div className="fixed inset-0 z-50 bg-slate-950/45 p-4 grid place-items-center"><section className="w-full max-w-lg rounded-3xl bg-white border p-6 soft"><h2 className="text-xl font-black">Modifier le quiz</h2><div className="mt-4 space-y-3"><label className="block text-sm font-black">Titre<input value={libraryEdit.title} onChange={e=>setLibraryEdit(x=>({...x,title:e.target.value}))} className="tap mt-1 w-full rounded-xl border px-3"/></label><label className="block text-sm font-black">Matière<input value={libraryEdit.subject} onChange={e=>setLibraryEdit(x=>({...x,subject:e.target.value}))} className="tap mt-1 w-full rounded-xl border px-3"/></label><label className="block text-sm font-black">Niveau<input value={libraryEdit.level} onChange={e=>setLibraryEdit(x=>({...x,level:e.target.value}))} className="tap mt-1 w-full rounded-xl border px-3"/></label></div><div className="mt-6 grid grid-cols-2 gap-3"><button onClick={()=>setLibraryEdit(null)} className="tap rounded-xl border font-black">Annuler</button><button onClick={saveLibraryEdit} className="tap rounded-xl bg-indigo-700 text-white font-black">Enregistrer</button></div></section></div>}
 </main>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
