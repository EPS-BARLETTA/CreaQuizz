<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Quizz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/quiz-engine-v11.js?v=11.3"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a}button,input,select,textarea{font:inherit}.tap{min-height:48px}.shadow-soft{box-shadow:0 14px 35px rgba(15,23,42,.08)}:focus-visible{outline:3px solid #111827;outline-offset:3px}.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.hero-orb{position:absolute;border-radius:9999px;filter:blur(50px);opacity:.28;pointer-events:none}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useRef,useState}=React;
const GOOD=["Bravo ! C’est juste.","Très bien !","Excellent !","Bien joué !","Parfait !"];
const BAD=["Pas cette fois. Regarde la correction.","Bonne tentative. Lis bien l’explication.","Encore un effort, tu progresses."];

async function extractPageText(page){
  const tc=await page.getTextContent();
  const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str,x:x.transform?.[4]||0,y:x.transform?.[5]||0})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);
  const lines=[];let row=[],last=null;
  for(const it of items){
    if(last===null||Math.abs(it.y-last)<=2.5)row.push(it);else{if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));row=[it]}
    last=it.y;
  }
  if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));
  return QuizzEngine.normalizeFrench(lines.join("\n"));
}
async function extractPdfText(file,onProgress){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=pdf.numPages;p++){
    onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);
    const page=await pdf.getPage(p);let text=await extractPageText(page);
    if(text.length<80){
      const vp=page.getViewport({scale:1.5}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      const r=await Tesseract.recognize(c,"fra");text=QuizzEngine.normalizeFrench(r.data.text||"");
    }
    out.push(`[[PAGE:${p}]]\n${text}`);
  }
  return out.join("\n\n");
}
async function publishQuiz(payload){const r=await fetch("/api/save-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Publication impossible.");return d.id}
async function loadQuiz(id){const r=await fetch(`/api/get-quiz?id=${encodeURIComponent(id)}`),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Quiz introuvable.");return d}
async function loadLibrary(){const r=await fetch("/api/list-quizzes"),d=await r.json().catch(()=>({}));return Array.isArray(d.items)?d.items:[]}
async function deleteQuiz(id){const r=await fetch("/api/delete-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Suppression impossible.")}
function studentUrl(id){const u=new URL(location.href);u.pathname="/";u.search="";u.searchParams.set("quiz",id);u.hash="";return u.toString()}
function fileTitle(name){return String(name||"").replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().slice(0,70)||"Quizz"}
function fmtDate(v){try{return new Date(v).toLocaleString("fr-FR")}catch{return ""}}

function App(){
  const studentId=new URLSearchParams(location.search).get("quiz");
  const [mode,setMode]=useState(studentId?"loading":"teacher");
  const [title,setTitle]=useState("Quizz"),[count,setCount]=useState(10),[course,setCourse]=useState(""),[filename,setFilename]=useState("");
  const [busy,setBusy]=useState(""),[error,setError]=useState(""),[notice,setNotice]=useState("");
  const [quiz,setQuiz]=useState([]),[url,setUrl]=useState(""),[library,setLibrary]=useState([]),[showAll,setShowAll]=useState(false),[search,setSearch]=useState("");
  const [deleteTarget,setDeleteTarget]=useState(null),[deleting,setDeleting]=useState(false);
  const [idx,setIdx]=useState(0),[selected,setSelected]=useState(""),[feedback,setFeedback]=useState(null),[hint,setHint]=useState(false),[answers,setAnswers]=useState({});
  const qrRef=useRef(null),current=quiz[idx],score=Object.values(answers).filter(x=>x.correct).length;

  useEffect(()=>{if(studentId){loadQuiz(studentId).then(d=>{setTitle(d.title||"Quizz");setQuiz(d.questions||[]);setMode("intro")}).catch(e=>{setError(e.message);setMode("error")})}else loadLibrary().then(setLibrary).catch(()=>{})},[]);
  useEffect(()=>{if(mode==="published"&&url&&qrRef.current){qrRef.current.innerHTML="";new QRCode(qrRef.current,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}},[mode,url]);

  const filtered=useMemo(()=>library.filter(x=>String(x.title||"").toLowerCase().includes(search.toLowerCase().trim())),[library,search]);
  const visible=(showAll||search)?filtered:filtered.slice(0,3);
  const totalQuestions=library.reduce((n,x)=>n+(Number(x.count)||0),0);

  async function importFile(e){
    const f=e.target.files?.[0];if(!f)return;
    setFilename(f.name);if(!title.trim()||title.trim().toLowerCase()==="quizz")setTitle(fileTitle(f.name));setError("");setNotice("");
    try{
      setBusy("Lecture du document…");
      if(f.type==="application/pdf"||/\.pdf$/i.test(f.name))setCourse(await extractPdfText(f,setBusy));
      else if(f.type.startsWith("image/")){const r=await Tesseract.recognize(f,"fra");setCourse(`[[PAGE:1]]\n${QuizzEngine.normalizeFrench(r.data.text||"")}`)}
      else setCourse(`[[PAGE:1]]\n${QuizzEngine.normalizeFrench(await f.text())}`);
      setBusy("");
    }catch(e){setBusy("");setCourse("");setError(e.message)}
  }
  async function createQuiz(){
    setError("");setNotice("");
    try{
      if(!course)throw new Error("Importe d’abord ton cours.");
      setBusy("Analyse pédagogique du cours…");
      const result=QuizzEngine.buildQuiz(course,count),qs=result.questions;
      if(qs.length<count)setNotice(`${qs.length} questions fiables ont été générées sur ${count} demandées. Le moteur a refusé les questions insuffisamment fiables.`);
      else setNotice(`${qs.length} questions validées à partir de ${result.bank.length} notions exploitables.`);
      setBusy("Publication du quiz…");
      const id=await publishQuiz({app:"quizz",version:11,title,createdAt:new Date().toISOString(),questions:qs});
      setQuiz(qs);setUrl(studentUrl(id));setBusy("");setMode("published");loadLibrary().then(setLibrary).catch(()=>{});
    }catch(e){setBusy("");setError(e.message)}
  }
  function start(){setIdx(0);setSelected("");setFeedback(null);setHint(false);setAnswers({});setMode("quiz")}
  function validate(){if(!selected||feedback)return;const ok=selected===current.answer;setAnswers(a=>({...a,[current.id]:{correct:ok,selected}}));setFeedback({correct:ok,text:ok?GOOD[(idx+score)%GOOD.length]:BAD[(idx+score)%BAD.length]})}
  function next(){if(idx+1>=quiz.length){setMode("results");scrollTo(0,0)}else{setIdx(x=>x+1);setSelected("");setFeedback(null);setHint(false);scrollTo(0,0)}}
  async function reopen(item){try{const d=await loadQuiz(item.id);setQuiz(d.questions||[]);setTitle(d.title||item.title);setUrl(studentUrl(item.id));setMode("published")}catch(e){setError(e.message)}}
  async function confirmDelete(){if(!deleteTarget)return;setDeleting(true);try{await deleteQuiz(deleteTarget.id);setLibrary(x=>x.filter(q=>q.id!==deleteTarget.id));setDeleteTarget(null)}catch(e){setError(e.message)}finally{setDeleting(false)}}

  if(mode==="loading")return <main className="min-h-screen grid place-items-center"><div className="font-black text-xl">Chargement du quiz…</div></main>;
  if(mode==="error")return <main className="min-h-screen grid place-items-center p-4"><section className="bg-white rounded-3xl border p-6 shadow-soft"><h1 className="text-2xl font-black">Quiz indisponible</h1><p className="mt-2 text-rose-700">{error}</p></section></main>;
  if(mode==="intro")return <main className="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-indigo-50 via-white to-fuchsia-50"><section className="w-full max-w-xl bg-white rounded-[2rem] border p-8 text-center shadow-soft"><div className="text-xs font-black uppercase tracking-[.16em] text-indigo-700">Quiz interactif</div><h1 className="mt-2 text-3xl font-black">{title}</h1><p className="mt-3 text-slate-600">{quiz.length} questions · correction immédiate · bilan final</p><button onClick={start} className="tap mt-7 w-full rounded-2xl bg-indigo-700 text-white font-black text-lg">Commencer</button></section></main>;

  if(mode==="quiz"&&current)return <main className="min-h-screen bg-slate-50"><header className="sticky top-0 z-20 bg-white/95 backdrop-blur border-b"><div className="max-w-2xl mx-auto p-4"><div className="flex justify-between font-black"><span>Question {idx+1}/{quiz.length}</span><span>{score} juste{score>1?"s":""}</span></div><div className="mt-2 h-2 rounded-full bg-slate-200"><div className="h-2 rounded-full bg-indigo-600" style={{width:`${Math.round((idx+1)/quiz.length*100)}%`}}/></div></div></header><div className="max-w-2xl mx-auto p-4"><section className="rounded-3xl border bg-white p-5 sm:p-7 shadow-soft"><h1 className="text-2xl font-black leading-snug">{current.question}</h1>{!feedback&&<><div className="mt-6 space-y-3">{current.options.map((opt,i)=>{const active=selected===opt;return <button key={i} type="button" onClick={()=>setSelected(opt)} className={`tap w-full rounded-2xl border-2 p-4 text-left font-bold flex gap-3 ${active?"border-indigo-600 bg-indigo-50":"border-slate-200 bg-white"}`}><span className={`mt-0.5 w-6 h-6 shrink-0 rounded-full border-2 grid place-items-center ${active?"border-indigo-600":"border-slate-300"}`}>{active&&<span className="w-3 h-3 rounded-full bg-indigo-600"/>}</span><span>{opt}</span></button>})}</div><button onClick={()=>setHint(x=>!x)} className="tap mt-5 w-full rounded-2xl border-2 border-amber-200 bg-amber-50 font-black">💡 {hint?"Masquer l’indice":"Indice du cours"}</button>{hint&&<div className="mt-3 rounded-2xl border border-amber-200 bg-amber-50 p-4">{current.hint}</div>}<button onClick={validate} disabled={!selected} className="tap mt-3 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black">Valider ma réponse</button></>}{feedback&&<div className={`mt-6 rounded-3xl border p-5 ${feedback.correct?"bg-emerald-50 border-emerald-200":"bg-rose-50 border-rose-200"}`}><div className="text-lg font-black">{feedback.text}</div>{!feedback.correct&&<p className="mt-3"><strong>Bonne réponse :</strong> {current.answer}</p>}<p className="mt-3"><strong>À retenir :</strong> {current.explanation}</p><details className="mt-4 rounded-2xl bg-white/80 p-4"><summary className="cursor-pointer font-black">📘 Voir l’extrait du cours</summary><p className="mt-2 text-sm leading-relaxed">{current.source}</p></details><button onClick={next} className="tap mt-5 w-full rounded-2xl bg-slate-900 text-white font-black">{idx+1===quiz.length?"Voir mon bilan":"Question suivante"}</button></div>}</section></div></main>;

  if(mode==="results"){
    const pct=quiz.length?Math.round(score/quiz.length*100):0,missed=quiz.filter(q=>!answers[q.id]?.correct);
    return <main className="min-h-screen p-4 bg-gradient-to-br from-emerald-50 via-white to-indigo-50"><div className="max-w-3xl mx-auto"><section className="bg-white rounded-[2rem] border p-7 text-center shadow-soft"><div className="text-sm font-black uppercase tracking-[.14em] text-slate-500">Résultat</div><h1 className="mt-1 text-4xl font-black">{score}/{quiz.length}</h1><p className="text-xl font-bold mt-1">{pct}%</p></section><section className="mt-5 bg-white rounded-3xl border p-5"><h2 className="text-xl font-black">Points à revoir</h2>{missed.length===0?<p className="mt-4 rounded-2xl bg-emerald-50 p-4 font-bold">Aucune erreur. Bravo !</p>:<div className="mt-4 space-y-3">{missed.map((q,i)=><details key={q.id} className="rounded-2xl border p-4"><summary className="cursor-pointer font-black">{i+1}. {q.question}</summary><p className="mt-2"><strong>Bonne réponse :</strong> {q.answer}</p><p className="mt-2 text-sm text-slate-600">{q.explanation}</p></details>)}</div>}</section><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Refaire le quiz</button></div></main>
  }

  if(mode==="published")return <main className="min-h-screen p-4 bg-gradient-to-br from-indigo-50 via-white to-emerald-50"><div className="max-w-3xl mx-auto"><button onClick={()=>setMode("teacher")} className="tap font-bold">← Nouveau quiz</button><section className="mt-3 bg-white rounded-[2rem] border p-7 text-center shadow-soft"><div className="text-xs font-black uppercase tracking-[.14em] text-indigo-600">Quiz publié</div><h1 className="mt-2 text-3xl font-black">{title}</h1><p className="mt-2 text-slate-600">{quiz.length} questions · QR élève prêt</p>{notice&&<div className="mt-4 rounded-2xl border border-indigo-200 bg-indigo-50 p-4 text-sm font-bold text-indigo-950">{notice}</div>}<div ref={qrRef} className="mt-6 mx-auto w-[260px] min-h-[260px] grid place-items-center"/><div className="mt-4 rounded-xl bg-slate-50 p-3 text-xs break-all text-slate-500">{url}</div><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Tester le quiz</button></section></div></main>;

  return <main className="min-h-screen bg-slate-50"><header className="relative overflow-hidden bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white"><div className="hero-orb w-72 h-72 bg-cyan-300 -top-24 -right-10"></div><div className="hero-orb w-80 h-80 bg-pink-300 -bottom-40 -left-16"></div><div className="relative max-w-5xl mx-auto px-4 py-9 sm:py-12"><div className="inline-flex rounded-full glass border border-white/15 px-3 py-1 text-xs font-black uppercase tracking-[.14em]">Quizz · Générateur pédagogique</div><h1 className="mt-4 text-4xl sm:text-5xl font-black">Créer un quiz fiable à partir d’un cours</h1><p className="mt-3 max-w-2xl text-indigo-100">Le moteur extrait les notions, écarte les passages mal lus et construit des questions cohérentes avant de générer le QR élève.</p><div className="mt-6 grid sm:grid-cols-3 gap-3 max-w-3xl"><div className="glass rounded-2xl px-4 py-3"><div className="font-black">1 · Importer</div><div className="text-sm text-indigo-100">PDF, image ou texte</div></div><div className="glass rounded-2xl px-4 py-3"><div className="font-black">2 · Valider</div><div className="text-sm text-indigo-100">Notions et QCM contrôlés</div></div><div className="glass rounded-2xl px-4 py-3"><div className="font-black">3 · Partager</div><div className="text-sm text-indigo-100">QR direct pour les élèves</div></div></div></div></header>
  <div className="max-w-5xl mx-auto px-4 py-8"><div className="grid lg:grid-cols-[1.35fr_.9fr] gap-6"><section className="bg-white rounded-[2rem] border p-6 sm:p-7 shadow-soft"><div className="text-xs font-black uppercase tracking-[.14em] text-indigo-600">Nouveau quiz</div><h2 className="mt-1 text-2xl font-black">Importer le cours</h2><p className="mt-1 text-sm text-slate-500">Le titre reprend automatiquement le nom du fichier si tu ne le modifies pas.</p><label className="mt-6 block rounded-3xl border-2 border-dashed border-indigo-300 bg-gradient-to-br from-indigo-50 to-violet-50 p-8 text-center cursor-pointer hover:from-indigo-100 hover:to-violet-100 transition"><div className="text-4xl">📥</div><div className="mt-3 font-black text-lg">{filename||"Choisir un PDF, une image ou un fichier texte"}</div><div className="mt-1 text-sm text-slate-500">Sélectionne ton document pour commencer</div><input className="sr-only" type="file" accept=".pdf,application/pdf,image/*,.txt,.md,.csv" onChange={importFile}/></label>{busy&&<div className="mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-4 font-bold">⏳ {busy}</div>}{course&&<div className="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4 font-bold">✓ Cours importé et prêt pour l’analyse.</div>}{error&&<div className="mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-4 font-bold text-rose-800">{error}</div>}<div className="mt-6 grid sm:grid-cols-2 gap-4"><label className="font-black text-sm">Nombre de questions<select value={count} onChange={e=>setCount(+e.target.value)} className="tap mt-2 w-full rounded-2xl border px-4 bg-white">{[10,15,20,25,30].map(n=><option key={n} value={n}>{n} questions</option>)}</select></label><label className="font-black text-sm">Titre du quiz<input value={title} onChange={e=>setTitle(e.target.value.slice(0,70))} className="tap mt-2 w-full rounded-2xl border px-4"/></label></div><button onClick={createQuiz} disabled={!course||!!busy} className="tap mt-6 w-full rounded-2xl bg-indigo-700 hover:bg-indigo-800 disabled:bg-slate-300 text-white font-black text-lg shadow-lg shadow-indigo-700/20">Créer le quiz & le QR</button><details className="mt-5 rounded-2xl border bg-slate-50 p-4"><summary className="cursor-pointer font-black text-sm">Option · vérifier le texte récupéré</summary><textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-64 rounded-xl border bg-white p-3 text-sm leading-relaxed"/></details></section>
  <aside className="space-y-6"><section className="bg-white rounded-[2rem] border p-5 shadow-soft"><h2 className="font-black">Contrôle qualité V11</h2><div className="mt-4 space-y-2 text-sm text-slate-700"><div className="rounded-xl bg-slate-50 p-3">✓ Rejet des formules PDF corrompues</div><div className="rounded-xl bg-slate-50 p-3">✓ Cohérence question ↔ réponse</div><div className="rounded-xl bg-slate-50 p-3">✓ Distracteurs du même type pédagogique</div><div className="rounded-xl bg-slate-50 p-3">✓ Diversité des notions avant publication</div></div></section>{library.length>0&&<section className="bg-white rounded-[2rem] border p-5 shadow-soft"><div className="flex items-center justify-between gap-3"><div><h2 className="text-lg font-black">Bibliothèque</h2><p className="text-sm text-slate-500">{showAll?"Tous les quiz":"Les 3 plus récents"}</p></div><div className="rounded-full bg-indigo-50 px-3 py-1 text-xs font-black text-indigo-700">{library.length}</div></div><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher un quiz…" className="tap mt-4 w-full rounded-xl border px-3 text-sm"/><div className="mt-4 space-y-3">{visible.map(item=><div key={item.id} className="rounded-2xl border p-4"><div className="font-black">{item.title}</div><div className="mt-1 text-xs text-slate-500">{item.count} questions · {fmtDate(item.createdAt)}</div><div className="mt-3 grid grid-cols-2 gap-2"><button onClick={()=>reopen(item)} className="tap rounded-xl bg-indigo-50 text-indigo-900 font-black text-sm">QR / ouvrir</button><button onClick={()=>setDeleteTarget(item)} className="tap rounded-xl bg-rose-50 text-rose-700 font-black text-sm">Supprimer</button></div></div>)}{visible.length===0&&<div className="rounded-2xl bg-slate-50 p-4 text-sm text-slate-500">Aucun quiz trouvé.</div>}</div>{library.length>3&&!search&&<button onClick={()=>setShowAll(x=>!x)} className="tap mt-4 w-full rounded-xl border font-black text-sm">{showAll?"Réduire":`Voir les ${library.length} quiz`}</button>}<div className="mt-4 grid grid-cols-2 gap-2"><div className="rounded-xl bg-slate-50 p-3 text-center"><div className="text-xl font-black">{library.length}</div><div className="text-xs text-slate-500">quiz stockés</div></div><div className="rounded-xl bg-slate-50 p-3 text-center"><div className="text-xl font-black">{totalQuestions}</div><div className="text-xs text-slate-500">questions</div></div></div></section>}</aside></div></div>
  {deleteTarget&&<div className="fixed inset-0 z-50 bg-slate-950/45 p-4 grid place-items-center"><section className="w-full max-w-md rounded-3xl bg-white border p-6 shadow-2xl"><div className="text-2xl">🗑️</div><h2 className="mt-2 text-xl font-black">Supprimer ce quiz ?</h2><p className="mt-2 text-slate-600">« {deleteTarget.title} » sera supprimé définitivement. Son ancien QR ne fonctionnera plus.</p><div className="mt-6 grid grid-cols-2 gap-3"><button onClick={()=>setDeleteTarget(null)} disabled={deleting} className="tap rounded-xl border font-black">Annuler</button><button onClick={confirmDelete} disabled={deleting} className="tap rounded-xl bg-rose-600 text-white font-black disabled:opacity-50">{deleting?"Suppression…":"Supprimer"}</button></div></section></div>}
  </main>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
