<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Quizz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a}button,input,select,textarea{font:inherit}.tap{min-height:48px}.shadow-soft{box-shadow:0 14px 35px rgba(15,23,42,.08)}:focus-visible{outline:3px solid #111827;outline-offset:3px}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useRef,useState}=React;
const GOOD=["Bravo ! C’est juste.","Très bien !","Excellent !","Bien joué !","Parfait !"];
const BAD=["Pas cette fois. Regarde la correction.","Bonne tentative. Lis bien l’explication.","Encore un effort, tu progresses."];

function normalizeText(t){
 return String(t||"")
  .replace(/\r/g,"\n")
  .replace(/DéOinition/gi,"Définition")
  .replace(/DeOinition/gi,"Définition")
  .replace(/coefOicient/gi,"coefficient")
  .replace(/coefOicients/gi,"coefficients")
  .replace(/sufOit/gi,"suffit")
  .replace(/signiWie/gi,"signifie")
  .replace(/\b([A-Za-zÀ-ÿ])\s+([A-Za-zÀ-ÿ])\s+([A-Za-zÀ-ÿ])\b/g,"$1$2$3")
  .replace(/[ \t]+/g," ")
  .replace(/\n{3,}/g,"\n\n")
  .trim();
}
function cleanLine(s){return normalizeText(s).replace(/[█■□�Ø]/g," ").replace(/\.{5,}/g," ").replace(/_{3,}/g," ").replace(/\s+/g," ").trim()}
function wordCount(s){return (s.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’-]*/g)||[]).length}
const BAD_END=/\b(?:de|du|des|d'|le|la|les|un|une|et|ou|à|au|aux|en|par|pour|avec|sans|dans|sur|sous|que|qui|dont|comme|si|lorsque|entre|vers|chez|ce|cet|cette|ces|son|sa|ses|leur|leurs)\s*[,:;]?$/i;
function cleanCandidate(s){
 s=cleanLine(s).replace(/^[-–—•]+\s*/,"").trim();
 if(s.length<28||s.length>260)return null;
 if(wordCount(s)<5)return null;
 if(BAD_END.test(s))return null;
 if(/[�█■□]/.test(s))return null;
 if(/\b[b-df-hj-np-tv-z]\s+[b-df-hj-np-tv-z]\b/i.test(s))return null;
 if(/\s['’]\s/.test(s))return null;
 if(/\b(?:page|chapitre)\s*\d+\b/i.test(s)&&wordCount(s)<9)return null;
 return s.replace(/\s+([,.;:!?])/g,"$1");
}
function isHeading(s){return /^(?:définition|définitions|propriété|méthode|règle\s*\d*|rappel|à retenir|point clé|exemple|exercice|activité|application)\s*:?$/i.test(s)}
function joinBrokenLines(text){
 const lines=normalizeText(text).split("\n").map(cleanLine).filter(Boolean);
 const out=[];let buf="";
 const flush=()=>{if(buf){out.push(buf.trim());buf=""}};
 for(const line of lines){
   if(isHeading(line)){flush();out.push(line);continue;}
   if(!buf){buf=line;continue;}
   const complete=/[.!?;:]$/.test(buf);
   const would=(buf+" "+line).length;
   if(complete||would>340){flush();buf=line}else buf+=" "+line;
 }
 flush();return out;
}
function extractFacts(text){
 const joined=joinBrokenLines(text);const facts=[];let pendingType="fact";
 function add(type,s){const c=cleanCandidate(s);if(!c)return;const k=c.toLowerCase();if(!facts.some(x=>x.key===k))facts.push({key:k,type,content:c})}
 for(const block of joined){
   if(/^(définition|définitions)\s*:?$/i.test(block)){pendingType="definition";continue}
   if(/^(propriété|méthode|règle\s*\d*|rappel|à retenir|point clé)\s*:?$/i.test(block)){pendingType="fact";continue}
   if(/^(exemple|exercice|activité|application)\s*:?$/i.test(block)){pendingType="skip";continue}
   if(pendingType==="skip"){pendingType="fact";continue}
   const sentences=block.split(/(?<=[.!?])\s+/).map(cleanLine).filter(Boolean);
   for(const s of sentences){
     if(/^(exercice|activité|application|exemple|correction|consigne)\b/i.test(s))continue;
     if(/\b(est|sont|désigne|signifie|correspond|permet|comprend|contient|consiste|se définit|a pour|ont pour|se compose|se situe|a lieu|commence|se termine|devient)\b/i.test(s)||pendingType==="definition") add(pendingType,s);
   }
   pendingType="fact";
 }
 return facts.map(({key,...x})=>x);
}
function parseDefinition(s){
 const pats=[/^(.{2,100}?)\s+(est une|est un|est le|est la|sont des|signifie|désigne|correspond à|se définit comme|consiste en|comprend|contient)\s+(.+)$/i,/^(.{2,100}?)\s+(a pour rôle de|a pour fonction de|a pour objectif de|permet de)\s+(.+)$/i];
 for(const p of pats){const m=s.match(p);if(m){const def=cleanCandidate(m[3]);if(def)return{term:cleanLine(m[1]),verb:m[2],definition:def}}}return null;
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function distinctEnough(a,b){const A=new Set(a.toLowerCase().split(/\W+/).filter(x=>x.length>3));const B=new Set(b.toLowerCase().split(/\W+/).filter(x=>x.length>3));let common=0;A.forEach(x=>{if(B.has(x))common++});return common<Math.min(5,Math.ceil(Math.min(A.size,B.size)*.7))}
function buildQuiz(text,count){
 const facts=extractFacts(text);
 const defs=facts.map(x=>({...x,parsed:parseDefinition(x.content)})).filter(x=>x.parsed);
 const questions=[];
 defs.forEach((d,i)=>{
   const alts=shuffle(defs.filter((x,j)=>j!==i&&distinctEnough(d.parsed.definition,x.parsed.definition)).map(x=>x.parsed.definition)).slice(0,3);
   if(alts.length>=2)questions.push({id:`d-${i}`,question:`Quelle définition correspond à « ${d.parsed.term} » ?`,options:shuffle([d.parsed.definition,...alts]),answer:d.parsed.definition,hint:`Relis la définition de « ${d.parsed.term} ».`,explanation:`${d.parsed.term} ${d.parsed.verb} ${d.parsed.definition}.`,source:d.content});
   const terms=shuffle(defs.filter((x,j)=>j!==i).map(x=>x.parsed.term).filter(x=>x.length>2&&x.length<90)).slice(0,3);
   if(terms.length>=2)questions.push({id:`t-${i}`,question:`Quel terme correspond à cette définition : « ${d.parsed.definition} » ?`,options:shuffle([d.parsed.term,...terms]),answer:d.parsed.term,hint:"Relis les définitions du cours.",explanation:`La bonne réponse est « ${d.parsed.term} ».`,source:d.content});
 });
 facts.forEach((f,i)=>{
   const alts=shuffle(facts.filter((x,j)=>j!==i&&x.content.length<190&&distinctEnough(f.content,x.content)).map(x=>x.content)).slice(0,3);
   if(alts.length>=2)questions.push({id:`f-${i}`,question:"Quelle affirmation est correcte d’après le cours ?",options:shuffle([f.content,...alts]),answer:f.content,hint:"Relis le passage du cours correspondant.",explanation:f.content,source:f.content});
 });
 defs.slice(0,8).forEach((d,i)=>questions.push({id:`vf-${i}`,question:`Vrai ou faux : « ${d.content} »`,options:["Vrai","Faux"],answer:"Vrai",hint:`Relis la notion « ${d.parsed.term} ».`,explanation:d.content,source:d.content}));
 const seen=new Set();const clean=questions.filter(q=>{
   if(!cleanCandidate(q.question.replace(/^Quelle définition correspond à «|» \?$/g,"notion complète"))&& !/^Vrai ou faux|^Quel terme|^Quelle affirmation/.test(q.question))return false;
   if(q.options.some(o=>!["Vrai","Faux"].includes(o)&&!cleanCandidate(o)))return false;
   const k=q.question.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;
 });
 if(clean.length<5)throw new Error("Le cours est lisible, mais je ne trouve pas assez de phrases complètes pour fabriquer un QCM fiable. Essaie un PDF avec du texte plus net.");
 return shuffle(clean).slice(0,Math.min(count,clean.length));
}

async function extractPageText(page){const tc=await page.getTextContent();const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str,x:x.transform?.[4]||0,y:x.transform?.[5]||0})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);const lines=[];let row=[],last=null;for(const it of items){if(last===null||Math.abs(it.y-last)<=2.5)row.push(it);else{if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));row=[it]}last=it.y}if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));return normalizeText(lines.join("\n"))}
async function extractPdfText(file,onProgress){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];for(let p=1;p<=pdf.numPages;p++){onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);const page=await pdf.getPage(p);let text=await extractPageText(page);if(text.length<80){const vp=page.getViewport({scale:1.5});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const r=await Tesseract.recognize(c,"fra");text=normalizeText(r.data.text||"")}pages.push(text)}const full=normalizeText(pages.join("\n\n"));if(full.length<120)throw new Error("Je n’arrive pas à récupérer assez de texte dans ce PDF.");return full}
async function publishQuiz(payload){const r=await fetch("/api/save-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Publication impossible.");return d.id}
async function loadQuiz(id){const r=await fetch(`/api/get-quiz?id=${encodeURIComponent(id)}`);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Quiz introuvable.");return d}
async function loadLibrary(){const r=await fetch("/api/list-quizzes");const d=await r.json().catch(()=>({}));return Array.isArray(d.items)?d.items:[]}
function studentUrl(id){const u=new URL(location.href);u.pathname="/";u.search="";u.searchParams.set("quiz",id);u.hash="";return u.toString()}

function App(){
 const studentId=new URLSearchParams(location.search).get("quiz");
 const [mode,setMode]=useState(studentId?"loading":"teacher"),[title,setTitle]=useState("Quizz"),[count,setCount]=useState(15),[course,setCourse]=useState(""),[filename,setFilename]=useState(""),[busy,setBusy]=useState(""),[error,setError]=useState(""),[quiz,setQuiz]=useState([]),[url,setUrl]=useState(""),[library,setLibrary]=useState([]),[idx,setIdx]=useState(0),[selected,setSelected]=useState(""),[feedback,setFeedback]=useState(null),[hint,setHint]=useState(false),[answers,setAnswers]=useState({});
 const qrRef=useRef(null),current=quiz[idx],score=Object.values(answers).filter(x=>x.correct).length;
 useEffect(()=>{if(studentId){loadQuiz(studentId).then(d=>{setTitle(d.title||"Quizz");setQuiz(d.questions||[]);setMode("intro")}).catch(e=>{setError(e.message);setMode("error")})}else loadLibrary().then(setLibrary).catch(()=>{})},[]);
 useEffect(()=>{if(mode==="published"&&url&&qrRef.current){qrRef.current.innerHTML="";new QRCode(qrRef.current,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}},[mode,url]);
 async function importFile(e){const f=e.target.files?.[0];if(!f)return;setFilename(f.name);setError("");try{if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){setBusy("Lecture du PDF…");setCourse(await extractPdfText(f,setBusy))}else if(f.type.startsWith("image/")){setBusy("Lecture de l’image…");const r=await Tesseract.recognize(f,"fra");setCourse(normalizeText(r.data.text||""))}else setCourse(normalizeText(await f.text()));setBusy("")}catch(err){setBusy("");setError(err.message);setCourse("")}}
 async function createQuiz(){setError("");try{if(!course)throw new Error("Importe d’abord ton cours.");setBusy("Création du QCM…");const qs=buildQuiz(course,count);setBusy("Publication…");const id=await publishQuiz({app:"quizz",version:6,title,createdAt:new Date().toISOString(),questions:qs});setQuiz(qs);setUrl(studentUrl(id));setBusy("");setMode("published");loadLibrary().then(setLibrary).catch(()=>{})}catch(e){setBusy("");setError(e.message)}}
 function start(){setIdx(0);setSelected("");setFeedback(null);setHint(false);setAnswers({});setMode("quiz")}
 function validate(){if(!selected||feedback)return;const ok=selected===current.answer;setAnswers(a=>({...a,[current.id]:{correct:ok,selected}}));setFeedback({correct:ok,text:ok?GOOD[(idx+score)%GOOD.length]:BAD[(idx+score)%BAD.length]})}
 function next(){if(idx+1>=quiz.length){setMode("results");scrollTo(0,0)}else{setIdx(x=>x+1);setSelected("");setFeedback(null);setHint(false);scrollTo(0,0)}}
 async function reopen(item){setBusy("Chargement…");try{const d=await loadQuiz(item.id);setQuiz(d.questions||[]);setTitle(d.title||item.title);setUrl(studentUrl(item.id));setMode("published")}catch(e){setError(e.message)}finally{setBusy("")}}
 if(mode==="loading")return <main className="min-h-screen grid place-items-center"><h1 className="text-2xl font-black">Chargement du quiz…</h1></main>;
 if(mode==="error")return <main className="min-h-screen grid place-items-center p-4"><div className="bg-white rounded-3xl p-6 border"><h1 className="text-2xl font-black">Quiz indisponible</h1><p className="mt-2 text-rose-700">{error}</p></div></main>;
 if(mode==="intro")return <main className="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-indigo-50 via-white to-fuchsia-50"><section className="max-w-xl w-full bg-white rounded-[2rem] p-8 text-center shadow-soft border"><div className="text-xs uppercase tracking-widest font-black text-indigo-700">Quiz interactif</div><h1 className="text-3xl font-black mt-2">{title}</h1><p className="mt-3 text-slate-600">{quiz.length} questions · indice · bilan final</p><button onClick={start} className="tap mt-7 w-full rounded-2xl bg-indigo-700 text-white font-black text-lg">Commencer</button></section></main>;
 if(mode==="quiz"&&current)return <main className="min-h-screen bg-slate-50"><header className="sticky top-0 bg-white border-b z-20"><div className="max-w-2xl mx-auto p-4"><div className="flex justify-between font-black"><span>Question {idx+1}/{quiz.length}</span><span>{score} juste{score>1?"s":""}</span></div><div className="mt-2 h-2 bg-slate-200 rounded-full"><div className="h-2 bg-indigo-600 rounded-full" style={{width:`${Math.round((idx+1)/quiz.length*100)}%`}}/></div></div></header><div className="max-w-2xl mx-auto p-4"><section className="bg-white rounded-3xl p-5 sm:p-7 border shadow-soft"><h1 className="text-2xl font-black">{current.question}</h1>{!feedback&&<><div className="mt-6 space-y-3">{current.options.map((opt,i)=>{const active=selected===opt;return <button key={i} type="button" onClick={()=>setSelected(opt)} className={`tap w-full text-left rounded-2xl border-2 p-4 flex gap-3 font-bold ${active?"border-indigo-600 bg-indigo-50":"border-slate-200 bg-white"}`}><span className={`mt-0.5 w-6 h-6 shrink-0 rounded-full border-2 grid place-items-center ${active?"border-indigo-600":"border-slate-300"}`}>{active&&<span className="w-3 h-3 rounded-full bg-indigo-600"/>}</span><span>{opt}</span></button>})}</div><button onClick={()=>setHint(x=>!x)} className="tap mt-5 w-full rounded-2xl border-2 border-amber-200 bg-amber-50 font-black">💡 {hint?"Masquer l’indice":"Indice du cours"}</button>{hint&&<div className="mt-3 p-4 rounded-2xl bg-amber-50 border border-amber-200">{current.hint}</div>}<button onClick={validate} disabled={!selected} className="tap mt-3 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black">Valider ma réponse</button></>}{feedback&&<div className={`mt-6 rounded-3xl border p-5 ${feedback.correct?"bg-emerald-50 border-emerald-200":"bg-rose-50 border-rose-200"}`}><div className="text-lg font-black">{feedback.text}</div>{!feedback.correct&&<p className="mt-3"><strong>Bonne réponse :</strong> {current.answer}</p>}<p className="mt-3"><strong>À retenir :</strong> {current.explanation}</p><details className="mt-4 bg-white/70 p-4 rounded-2xl"><summary className="font-black cursor-pointer">📘 Voir l’extrait du cours</summary><p className="mt-2 text-sm">{current.source}</p></details><button onClick={next} className="tap mt-5 w-full rounded-2xl bg-slate-900 text-white font-black">{idx+1===quiz.length?"Voir mon bilan":"Question suivante"}</button></div>}</section></div></main>;
 if(mode==="results"){const pct=quiz.length?Math.round(score/quiz.length*100):0,missed=quiz.filter(q=>!answers[q.id]?.correct);return <main className="min-h-screen p-4 bg-gradient-to-br from-emerald-50 via-white to-indigo-50"><div className="max-w-3xl mx-auto"><section className="bg-white rounded-[2rem] p-7 text-center border shadow-soft"><h1 className="text-4xl font-black">{score}/{quiz.length}</h1><p className="text-xl font-bold mt-1">{pct}%</p></section><section className="mt-5 bg-white rounded-3xl p-5 border"><h2 className="text-xl font-black">Points à revoir</h2>{missed.length===0?<p className="mt-3 bg-emerald-50 p-4 rounded-2xl font-bold">Aucune erreur. Bravo !</p>:<div className="mt-4 space-y-3">{missed.map((q,i)=><details key={q.id} className="p-4 border rounded-2xl"><summary className="font-black">{i+1}. {q.question}</summary><p className="mt-2"><strong>Bonne réponse :</strong> {q.answer}</p></details>)}</div>}</section><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Refaire le quiz</button></div></main>}
 if(mode==="published")return <main className="min-h-screen p-4 bg-gradient-to-br from-indigo-50 via-white to-emerald-50"><div className="max-w-3xl mx-auto"><button onClick={()=>setMode("teacher")} className="tap font-bold">← Nouveau quiz</button><section className="mt-3 bg-white rounded-[2rem] p-7 text-center border shadow-soft"><h1 className="text-3xl font-black">{title}</h1><p className="mt-2 text-slate-600">{quiz.length} questions · QR élève prêt</p><div ref={qrRef} className="mt-6 mx-auto w-[260px] min-h-[260px] grid place-items-center"/><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Tester le quiz</button></section></div></main>;
 return <main className="min-h-screen"><header className="bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white"><div className="max-w-4xl mx-auto px-4 py-9"><h1 className="text-4xl font-black">Quizz</h1><p className="mt-2 text-indigo-100">Importe ton cours → choisis le nombre de questions → crée le quiz & le QR.</p></div></header><div className="max-w-4xl mx-auto p-4 py-6"><section className="bg-white rounded-3xl p-5 sm:p-7 border shadow-soft"><h2 className="text-xl font-black">1. Importer le cours</h2><label className="tap mt-4 w-full rounded-2xl border-2 border-dashed border-indigo-300 bg-indigo-50 cursor-pointer px-4 py-6 flex justify-center font-black">{filename||"Choisir un PDF, une image ou un fichier texte"}<input className="sr-only" type="file" accept=".pdf,application/pdf,image/*,.txt,.md,.csv" onChange={importFile}/></label>{busy&&<div className="mt-4 p-4 rounded-2xl bg-amber-50 border border-amber-200 font-bold">{busy}</div>}{course&&<div className="mt-4 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 font-bold">✓ Cours importé. Tu peux créer le QCM.</div>}{error&&<div className="mt-4 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-900 font-bold">{error}</div>}<div className="mt-5 grid sm:grid-cols-2 gap-4"><label className="font-black">2. Nombre de questions<select value={count} onChange={e=>setCount(Number(e.target.value))} className="tap mt-2 w-full rounded-xl border px-3 bg-white">{[10,15,20,25,30].map(n=><option key={n}>{n}</option>)}</select></label><label className="font-black">Titre<input value={title} onChange={e=>setTitle(e.target.value.slice(0,70))} className="tap mt-2 w-full rounded-xl border px-3"/></label></div><button onClick={createQuiz} disabled={!course||!!busy} className="tap mt-6 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black text-lg">Créer le quiz & le QR</button><details className="mt-5 p-4 rounded-2xl border"><summary className="font-black cursor-pointer text-sm">Option : voir le texte récupéré</summary><textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-64 rounded-xl border p-3 text-sm"/></details></section>{library.length>0&&<section className="mt-5 bg-white rounded-3xl p-5 border shadow-soft"><h2 className="text-lg font-black">Bibliothèque des quiz</h2><p className="mt-1 text-sm text-slate-500">Les quiz publiés sont retrouvables ici depuis n’importe quel appareil.</p><div className="mt-4 space-y-3">{library.map(item=><div key={item.id} className="p-4 border rounded-2xl"><div className="font-black">{item.title}</div><div className="mt-1 text-xs text-slate-500">{item.count} questions · {new Date(item.createdAt).toLocaleString("fr-FR")}</div><button onClick={()=>reopen(item)} className="tap mt-3 w-full rounded-xl bg-indigo-50 text-indigo-900 font-black">Réafficher le QR</button></div>)}</div></section>}</div></main>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
