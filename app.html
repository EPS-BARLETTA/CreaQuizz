<script type="text/babel">
const {useEffect,useRef,useState}=React;
const GOOD=["Bravo ! C’est juste.","Très bien !","Excellent !","Bien joué !","Parfait !"];
const BAD=["Pas cette fois. Regarde la correction.","Bonne tentative. Lis bien l’explication.","Encore un effort, tu progresses."];
function normalizeText(t){return String(t||"").normalize("NFC").replace(/\r/g,"\n").replace(/DéOinition/gi,"Définition").replace(/DeOinition/gi,"Définition").replace(/coefOicients?/gi,m=>m.toLowerCase().endsWith("s")?"coefficients":"coefficient").replace(/sufOit/gi,"suffit").replace(/signiWie/gi,"signifie").replace(/\be\s+n\b/gi,"en").replace(/\bd\s+'\s*/gi,"d’").replace(/\bl\s+'\s*/gi,"l’").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}
function cleanLine(s){return normalizeText(s).replace(/[█■□�Ø]/g," ").replace(/\.{5,}/g," ").replace(/_{3,}/g," ").replace(/\s+([,.;:!?])/g,"$1").replace(/\s+/g," ").trim()}
function wc(s){return (s.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’\-]*/g)||[]).length}
function alphaRatio(s){const a=(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;return a/Math.max(1,s.length)}
function stripLead(s){return cleanLine(s).replace(/^\s*[►➤▶•·Ø#]+\s*/,"").replace(/^\s*\d+\s+(?=[A-ZÀ-ÖØ-Þ])/u,"").replace(/^\s*(?:Définition|Définitions|Propriété|Méthode|Remarque|Remarques|Rappel|Rappels|Règle\s*\d*|À retenir|Point clé)\s*:\s*/i,"").trim()}
function noiseLine(s){const x=cleanLine(s);return !x||/https?:\/\//i.test(x)||/\bCOURSIMAULT\b/i.test(x)||/^\d+\s+2025-2026$/i.test(x)||/^5C4\s+Chapitre/i.test(x)||/^Chapitre\s*\d+\b/i.test(x)||/^\d+\s*$/.test(x)||/^Dans\s+Amplitude/i.test(x)||/^Exercice\s*\d+/i.test(x)||/^Application\s*\d*/i.test(x)||/^Exemples?\s*:?$/i.test(x)||/^Démonstration\s*:?$/i.test(x)}
const BAD_END=/\b(?:de|du|des|d'|d’|le|la|les|un|une|et|ou|à|au|aux|en|par|pour|avec|sans|dans|sur|sous|que|qui|dont|comme|si|entre|vers|chez|ce|cet|cette|ces|son|sa|ses|leur|leurs)\s*[,:;]?$/i;
function cleanCandidate(s){s=stripLead(s);if(s.length<24||s.length>250||wc(s)<5||BAD_END.test(s)||/[�█■□]/.test(s))return null;if(alphaRatio(s)<.55)return null;if(/(?:[=+#<>]\s*){3,}/.test(s))return null;if(/\b(?:Chapitre|COURSIMAULT|2025|2026|2027)\b/i.test(s))return null;if(/^\d+\s+En\s+/i.test(s))s=s.replace(/^\d+\s+/,"");return s}
function pageBlocks(text){const parts=String(text).split(/\[\[PAGE:(\d+)\]\]/);const out=[];if(parts.length===1)return[{page:1,text}];for(let i=1;i<parts.length;i+=2)out.push({page:Number(parts[i]),text:parts[i+1]||""});return out}
function sectionTitle(line,current){const x=cleanLine(line);if(/^I{1,3}\s*[-–—]/i.test(x)||/^\d+\)\s+\S/.test(x)||/^\d+\s*[-–—]\s+\S/.test(x))return x.slice(0,100);return current}
function joinLines(lines){const out=[];let buf="";const flush=()=>{if(buf){out.push(buf.trim());buf=""}};for(const raw of lines){const line=cleanLine(raw);if(noiseLine(line))continue;if(/^(?:Définition|Définitions|Propriété|Méthode|Remarque|Remarques|Rappel|Rappels|Règle\s*\d*|À retenir|Point clé)\s*:/i.test(line)){flush();out.push(line);continue}if(!buf){buf=line;continue}const complete=/[.!?;:]$/.test(buf);if(complete||(buf+" "+line).length>300){flush();buf=line}else buf+=" "+line}flush();return out}
function extractFacts(text){const facts=[];for(const pg of pageBlocks(text)){let section=`Page ${pg.page}`;const lines=pg.text.split("\n");for(const l of lines)section=sectionTitle(l,section);for(const block of joinLines(lines)){let type="fact";if(/^Définition/i.test(block))type="definition";else if(/^Méthode|^Règle|^Propriété|^Rappel/i.test(block))type="rule";const sentences=block.split(/(?<=[.!?])\s+/).map(stripLead).filter(Boolean);for(let s of sentences){s=s.replace(/^\d+\s+En\s+/i,"En ");const c=cleanCandidate(s);if(!c)continue;if(!/\b(est|sont|désigne|signifie|correspond|permet|comprend|contient|consiste|se définit|a pour|ont pour|se compose|revient|on\s+(?:ajoute|recopie|applique|additionne|multiplie)|il\s+(?:suffit|faut))\b/i.test(c)&&type==="fact")continue;const key=c.toLowerCase().replace(/[^a-zà-ÿ0-9]+/gi," ").trim();if(!facts.some(x=>x.key===key))facts.push({key,type,content:c,page:pg.page,section})}}}return facts}
function parseDefinition(s){const x=stripLead(s);const pats=[/^(.{2,100}?)\s+(est une|est un|est le|est la|sont des|signifie|désigne|correspond à|se définit comme|consiste en|comprend|contient)\s+(.+)$/i,/^(.{2,100}?)\s+(a pour rôle de|a pour fonction de|a pour objectif de|permet de)\s+(.+)$/i];for(const p of pats){const m=x.match(p);if(m){const term=stripLead(m[1]).replace(/^\d+\s+/,"");const def=cleanCandidate(m[3]);if(term.length>2&&term.length<100&&def)return{term,verb:m[2],definition:def}}}return null}
function parseProcedure(s){const x=stripLead(s);let m=x.match(/^Pour\s+(.{4,120}?),\s*(.+)$/i);if(m){const ans=cleanCandidate(m[2]);if(ans)return{prompt:`Que faut-il faire pour ${m[1].replace(/^\s*/,"")} ?`,answer:ans}}m=x.match(/^(.{3,100}?)\s+permet de\s+(.+)$/i);if(m){const ans=cleanCandidate(`Il permet de ${m[2]}`);if(ans)return{prompt:`Que permet « ${m[1]} » ?`,answer:ans}}return null}
function topicKey(s){return stripLead(s).toLowerCase().replace(/\b(?:une|un|le|la|les|des|de|du|d|est|sont|en|mathématiques|expression|littérale|définition)\b/g," ").replace(/[^a-zà-ÿ0-9]+/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,5).join(" ")}
function overlap(a,b){const A=new Set(topicKey(a).split(" ").filter(Boolean)),B=new Set(topicKey(b).split(" ").filter(Boolean));let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.max(1,Math.min(A.size,B.size))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function goodAlt(a,b){return overlap(a,b)<.65&&Math.abs(a.length-b.length)<170}
function buildQuiz(text,count){const facts=extractFacts(text);const defs=facts.map(f=>({...f,parsed:parseDefinition(f.content)})).filter(f=>f.parsed);const procs=facts.map(f=>({...f,proc:parseProcedure(f.content)})).filter(f=>f.proc);const qs=[];defs.forEach((d,i)=>{const alts=shuffle(defs.filter((x,j)=>j!==i&&goodAlt(d.parsed.definition,x.parsed.definition)).map(x=>x.parsed.definition)).slice(0,3);if(alts.length>=2)qs.push({id:`d-${i}`,topic:topicKey(d.parsed.term),page:d.page,section:d.section,question:`Quelle définition correspond à « ${d.parsed.term} » ?`,options:shuffle([d.parsed.definition,...alts]),answer:d.parsed.definition,hint:`Relis la notion « ${d.parsed.term} ».`,explanation:`${d.parsed.term} ${d.parsed.verb} ${d.parsed.definition}.`,source:d.content,type:"definition"})});procs.forEach((p,i)=>{const alts=shuffle(procs.filter((x,j)=>j!==i&&goodAlt(p.proc.answer,x.proc.answer)).map(x=>x.proc.answer)).slice(0,3);if(alts.length>=2)qs.push({id:`p-${i}`,topic:topicKey(p.proc.prompt),page:p.page,section:p.section,question:p.proc.prompt,options:shuffle([p.proc.answer,...alts]),answer:p.proc.answer,hint:"Relis la méthode ou la règle correspondante.",explanation:p.content,source:p.content,type:"procedure"})});const usedBase=new Set(qs.map(q=>q.topic));for(const d of defs){const tk=topicKey(d.parsed.term);if(usedBase.has(tk))continue;qs.push({id:`vf-${d.page}-${qs.length}`,topic:tk,page:d.page,section:d.section,question:`Vrai ou faux : « ${d.content} »`,options:["Vrai","Faux"],answer:"Vrai",hint:`Relis la notion « ${d.parsed.term} ».`,explanation:d.content,source:d.content,type:"vf"});usedBase.add(tk)}const pool=shuffle(qs);const chosen=[],usedTopics=new Set(),usedPages=new Map();while(chosen.length<count){let best=null,bestScore=-999;for(const q of pool){if(chosen.includes(q)||usedTopics.has(q.topic))continue;const pg=usedPages.get(q.page)||0;let score=10-pg*4+(q.type==="definition"?3:q.type==="procedure"?2:0)+Math.random();if(score>bestScore){best=q;bestScore=score}}if(!best)break;chosen.push(best);usedTopics.add(best.topic);usedPages.set(best.page,(usedPages.get(best.page)||0)+1)}if(chosen.length<5)throw new Error("Le cours est lisible, mais je ne trouve pas encore assez de notions différentes et fiables pour fabriquer un bon QCM.");return{questions:chosen,found:facts.length,pages:new Set(facts.map(f=>f.page)).size}}
async function extractPageText(page){const tc=await page.getTextContent();const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str,x:x.transform?.[4]||0,y:x.transform?.[5]||0})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);const lines=[];let row=[],last=null;for(const it of items){if(last===null||Math.abs(it.y-last)<=2.5)row.push(it);else{if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));row=[it]}last=it.y}if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));return normalizeText(lines.join("\n"))}
async function extractPdfText(file,onProgress){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];for(let p=1;p<=pdf.numPages;p++){onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);const page=await pdf.getPage(p);let text=await extractPageText(page);if(text.length<80){const vp=page.getViewport({scale:1.5});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const r=await Tesseract.recognize(c,"fra");text=normalizeText(r.data.text||"")}pages.push(`[[PAGE:${p}]]\n${text}`)}const full=pages.join("\n\n");if(full.length<120)throw new Error("Je n’arrive pas à récupérer assez de texte dans ce PDF.");return full}
async function publishQuiz(payload){const r=await fetch("/api/save-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Publication impossible.");return d.id}
async function loadQuiz(id){const r=await fetch(`/api/get-quiz?id=${encodeURIComponent(id)}`);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Quiz introuvable.");return d}
async function loadLibrary(){const r=await fetch("/api/list-quizzes");const d=await r.json().catch(()=>({}));return Array.isArray(d.items)?d.items:[]}
function studentUrl(id){const u=new URL(location.href);u.pathname="/";u.search="";u.searchParams.set("quiz",id);u.hash="";return u.toString()}
function App(){const studentId=new URLSearchParams(location.search).get("quiz");const [mode,setMode]=useState(studentId?"loading":"teacher"),[title,setTitle]=useState("Quizz"),[count,setCount]=useState(15),[course,setCourse]=useState(""),[filename,setFilename]=useState(""),[busy,setBusy]=useState(""),[error,setError]=useState(""),[notice,setNotice]=useState(""),[quiz,setQuiz]=useState([]),[url,setUrl]=useState(""),[library,setLibrary]=useState([]),[idx,setIdx]=useState(0),[selected,setSelected]=useState(""),[feedback,setFeedback]=useState(null),[hint,setHint]=useState(false),[answers,setAnswers]=useState({});const qrRef=useRef(null),current=quiz[idx],score=Object.values(answers).filter(x=>x.correct).length;useEffect(()=>{if(studentId){loadQuiz(studentId).then(d=>{setTitle(d.title||"Quizz");setQuiz(d.questions||[]);setMode("intro")}).catch(e=>{setError(e.message);setMode("error")})}else loadLibrary().then(setLibrary).catch(()=>{})},[]);useEffect(()=>{if(mode==="published"&&url&&qrRef.current){qrRef.current.innerHTML="";new QRCode(qrRef.current,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}},[mode,url]);async function importFile(e){const f=e.target.files?.[0];if(!f)return;setFilename(f.name);setError("");setNotice("");try{if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){setBusy("Lecture du PDF…");setCourse(await extractPdfText(f,setBusy))}else if(f.type.startsWith("image/")){setBusy("Lecture de l’image…");const r=await Tesseract.recognize(f,"fra");setCourse(`[[PAGE:1]]\n${normalizeText(r.data.text||"")}`)}else setCourse(`[[PAGE:1]]\n${normalizeText(await f.text())}`);setBusy("")}catch(err){setBusy("");setError(err.message);setCourse("")}}async function createQuiz(){setError("");setNotice("");try{if(!course)throw new Error("Importe d’abord ton cours.");setBusy("Analyse des notions du cours…");const result=buildQuiz(course,count),qs=result.questions;if(qs.length<count)setNotice(`${qs.length} questions fiables ont été générées sur ${count} demandées. J’ai volontairement écarté les doublons et les passages mal lus.`);else setNotice(`${qs.length} questions générées à partir de ${result.found} notions détectées sur ${result.pages} page(s).`);setBusy("Publication…");const id=await publishQuiz({app:"quizz",version:7,title,createdAt:new Date().toISOString(),questions:qs});setQuiz(qs);setUrl(studentUrl(id));setBusy("");setMode("published");loadLibrary().then(setLibrary).catch(()=>{})}catch(e){setBusy("");setError(e.message)}}function start(){setIdx(0);setSelected("");setFeedback(null);setHint(false);setAnswers({});setMode("quiz")}function validate(){if(!selected||feedback)return;const ok=selected===current.answer;setAnswers(a=>({...a,[current.id]:{correct:ok,selected}}));setFeedback({correct:ok,text:ok?GOOD[(idx+score)%GOOD.length]:BAD[(idx+score)%BAD.length]})}function next(){if(idx+1>=quiz.length){setMode("results");scrollTo(0,0)}else{setIdx(x=>x+1);setSelected("");setFeedback(null);setHint(false);scrollTo(0,0)}}async function reopen(item){setBusy("Chargement…");try{const d=await loadQuiz(item.id);setQuiz(d.questions||[]);setTitle(d.title||item.title);setUrl(studentUrl(item.id));setMode("published")}catch(e){setError(e.message)}finally{setBusy("")}}
if(mode==="loading")return <main className="min-h-screen grid place-items-center"><h1 className="text-2xl font-black">Chargement du quiz…</h1></main>;
if(mode==="error")return <main className="min-h-screen grid place-items-center p-4"><div className="bg-white rounded-3xl p-6 border"><h1 className="text-2xl font-black">Quiz indisponible</h1><p className="mt-2 text-rose-700">{error}</p></div></main>;
if(mode==="intro")return <main className="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-indigo-50 via-white to-fuchsia-50"><section className="max-w-xl w-full bg-white rounded-[2rem] p-8 text-center shadow-soft border"><div className="text-xs uppercase tracking-widest font-black text-indigo-700">Quiz interactif</div><h1 className="text-3xl font-black mt-2">{title}</h1><p className="mt-3 text-slate-600">{quiz.length} questions · indice · bilan final</p><button onClick={start} className="tap mt-7 w-full rounded-2xl bg-indigo-700 text-white font-black text-lg">Commencer</button></section></main>;
if(mode==="quiz"&&current)return <main className="min-h-screen bg-slate-50"><header className="sticky top-0 bg-white border-b z-20"><div className="max-w-2xl mx-auto p-4"><div className="flex justify-between font-black"><span>Question {idx+1}/{quiz.length}</span><span>{score} juste{score>1?"s":""}</span></div><div className="mt-2 h-2 bg-slate-200 rounded-full"><div className="h-2 bg-indigo-600 rounded-full" style={{width:`${Math.round((idx+1)/quiz.length*100)}%`}}/></div></div></header><div className="max-w-2xl mx-auto p-4"><section className="bg-white rounded-3xl p-5 sm:p-7 border shadow-soft"><h1 className="text-2xl font-black">{current.question}</h1>{!feedback&&<><div className="mt-6 space-y-3">{current.options.map((opt,i)=>{const active=selected===opt;return <button key={i} type="button" onClick={()=>setSelected(opt)} className={`tap w-full text-left rounded-2xl border-2 p-4 flex gap-3 font-bold ${active?"border-indigo-600 bg-indigo-50":"border-slate-200 bg-white"}`}><span className={`mt-0.5 w-6 h-6 shrink-0 rounded-full border-2 grid place-items-center ${active?"border-indigo-600":"border-slate-300"}`}>{active&&<span className="w-3 h-3 rounded-full bg-indigo-600"/>}</span><span>{opt}</span></button>})}</div><button onClick={()=>setHint(x=>!x)} className="tap mt-5 w-full rounded-2xl border-2 border-amber-200 bg-amber-50 font-black">💡 {hint?"Masquer l’indice":"Indice du cours"}</button>{hint&&<div className="mt-3 p-4 rounded-2xl bg-amber-50 border border-amber-200">{current.hint}</div>}<button onClick={validate} disabled={!selected} className="tap mt-3 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black">Valider ma réponse</button></>}{feedback&&<div className={`mt-6 rounded-3xl border p-5 ${feedback.correct?"bg-emerald-50 border-emerald-200":"bg-rose-50 border-rose-200"}`}><div className="text-lg font-black">{feedback.text}</div>{!feedback.correct&&<p className="mt-3"><strong>Bonne réponse :</strong> {current.answer}</p>}<p className="mt-3"><strong>À retenir :</strong> {current.explanation}</p><details className="mt-4 bg-white/70 p-4 rounded-2xl"><summary className="font-black cursor-pointer">📘 Voir l’extrait du cours</summary><p className="mt-2 text-sm">{current.source}</p></details><button onClick={next} className="tap mt-5 w-full rounded-2xl bg-slate-900 text-white font-black">{idx+1===quiz.length?"Voir mon bilan":"Question suivante"}</button></div>}</section></div></main>;
if(mode==="results"){const pct=quiz.length?Math.round(score/quiz.length*100):0,missed=quiz.filter(q=>!answers[q.id]?.correct);return <main className="min-h-screen p-4 bg-gradient-to-br from-emerald-50 via-white to-indigo-50"><div className="max-w-3xl mx-auto"><section className="bg-white rounded-[2rem] p-7 text-center border shadow-soft"><h1 className="text-4xl font-black">{score}/{quiz.length}</h1><p className="text-xl font-bold mt-1">{pct}%</p></section><section className="mt-5 bg-white rounded-3xl p-5 border"><h2 className="text-xl font-black">Points à revoir</h2>{missed.length===0?<p className="mt-3 bg-emerald-50 p-4 rounded-2xl font-bold">Aucune erreur. Bravo !</p>:<div className="mt-4 space-y-3">{missed.map((q,i)=><details key={q.id} className="p-4 border rounded-2xl"><summary className="font-black">{i+1}. {q.question}</summary><p className="mt-2"><strong>Bonne réponse :</strong> {q.answer}</p><p className="mt-2 text-sm text-slate-600">{q.explanation}</p></details>)}</div>}</section><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Refaire le quiz</button></div></main>}
if(mode==="published")return <main className="min-h-screen p-4 bg-gradient-to-br from-indigo-50 via-white to-emerald-50"><div className="max-w-3xl mx-auto"><button onClick={()=>setMode("teacher")} className="tap font-bold">← Nouveau quiz</button><section className="mt-3 bg-white rounded-[2rem] p-7 text-center border shadow-soft"><h1 className="text-3xl font-black">{title}</h1><p className="mt-2 text-slate-600">{quiz.length} questions · QR élève prêt</p>{notice&&<div className="mt-4 rounded-2xl bg-indigo-50 border border-indigo-200 p-4 text-indigo-950 text-sm font-bold">{notice}</div>}<div ref={qrRef} className="mt-6 mx-auto w-[260px] min-h-[260px] grid place-items-center"/><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Tester le quiz</button></section></div></main>;
return <main className="min-h-screen bg-slate-50"><header className="relative overflow-hidden bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white"><div className="hero-orb w-72 h-72 bg-cyan-300 -top-24 -right-10"></div><div className="hero-orb w-80 h-80 bg-pink-300 -bottom-40 -left-16"></div><div className="relative max-w-5xl mx-auto px-4 py-9 sm:py-12"><div className="inline-flex items-center gap-2 rounded-full glass border border-white/15 px-3 py-1 text-xs font-black uppercase tracking-[.14em]">✨ Générateur de quiz</div><h1 className="mt-4 text-4xl sm:text-5xl font-black tracking-tight">Quizz</h1><p className="mt-3 max-w-2xl text-base sm:text-lg text-indigo-100 leading-relaxed">Transforme un cours en quiz interactif en quelques secondes. Importe ton document, choisis le nombre de questions, puis génère un QR prêt à partager.</p><div className="mt-6 grid sm:grid-cols-3 gap-3 max-w-3xl"><div className="glass border border-white/15 rounded-2xl px-4 py-3"><div className="font-black">📄 1. Importer</div><div className="mt-1 text-sm text-indigo-100">PDF, image ou texte</div></div><div className="glass border border-white/15 rounded-2xl px-4 py-3"><div className="font-black">⚙️ 2. Paramétrer</div><div className="mt-1 text-sm text-indigo-100">Questions et titre</div></div><div className="glass border border-white/15 rounded-2xl px-4 py-3"><div className="font-black">📱 3. Partager</div><div className="mt-1 text-sm text-indigo-100">QR direct pour les élèves</div></div></div></div></header><div className="max-w-5xl mx-auto px-4 py-6 sm:py-8"><div className="grid lg:grid-cols-[1.35fr_.9fr] gap-6"><section className="bg-white rounded-[2rem] border border-slate-200 p-5 sm:p-7 shadow-soft"><div><div className="text-xs font-black uppercase tracking-[.16em] text-indigo-600">Nouveau quiz</div><h2 className="mt-1 text-2xl font-black">Importer le cours</h2><p className="mt-1 text-sm text-slate-500">Ajoute le support à partir duquel Quizz va construire les questions.</p></div><label className="tap mt-6 w-full rounded-3xl border-2 border-dashed border-indigo-300 bg-gradient-to-br from-indigo-50 to-violet-50 hover:from-indigo-100 hover:to-violet-100 cursor-pointer px-5 py-8 flex flex-col items-center justify-center text-center transition"><div className="w-16 h-16 rounded-2xl bg-white shadow-sm grid place-items-center text-3xl">📥</div><span className="mt-4 text-lg font-black text-slate-900">{filename||"Choisir un PDF, une image ou un fichier texte"}</span><span className="mt-1 text-sm text-slate-500">Sélectionne ton document pour commencer</span><input className="sr-only" type="file" accept=".pdf,application/pdf,image/*,.txt,.md,.csv" onChange={importFile}/></label>{busy&&<div className="mt-4 rounded-2xl bg-amber-50 border border-amber-200 p-4 text-amber-950 font-bold">⏳ {busy}</div>}{course&&<div className="mt-4 rounded-2xl bg-emerald-50 border border-emerald-200 p-4 text-emerald-950 font-bold">✓ Cours importé. Tu peux créer le quiz.</div>}{error&&<div className="mt-4 rounded-2xl bg-rose-50 border border-rose-200 p-4 text-rose-900 font-bold">{error}</div>}<div className="mt-6 grid sm:grid-cols-2 gap-4"><label className="block"><span className="text-sm font-black text-slate-700">Nombre de questions</span><select value={count} onChange={e=>setCount(Number(e.target.value))} className="tap mt-2 w-full rounded-2xl border border-slate-300 bg-white px-4 font-semibold shadow-sm">{[10,15,20,25,30].map(n=><option key={n}>{n} questions</option>)}</select></label><label className="block"><span className="text-sm font-black text-slate-700">Titre du quiz</span><input value={title} onChange={e=>setTitle(e.target.value.slice(0,70))} className="tap mt-2 w-full rounded-2xl border border-slate-300 px-4 font-semibold shadow-sm" placeholder="Ex. Chapitre 1"/></label></div><button onClick={createQuiz} disabled={!course||!!busy} className="tap mt-6 w-full rounded-2xl bg-indigo-700 hover:bg-indigo-800 disabled:bg-slate-300 text-white font-black text-lg shadow-lg shadow-indigo-700/20 transition">✨ Créer le quiz & le QR</button><details className="mt-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><summary className="cursor-pointer font-black text-sm">📝 Option : voir le texte récupéré</summary><textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-64 rounded-xl border border-slate-300 bg-white p-3 text-sm leading-relaxed"></textarea></details></section><aside className="space-y-6"><section className="bg-white rounded-[2rem] border border-slate-200 p-5 shadow-soft"><div className="flex items-center gap-3"><div className="w-11 h-11 rounded-2xl bg-amber-100 grid place-items-center text-xl">💡</div><div><h2 className="font-black">Pour un meilleur résultat</h2><p className="text-sm text-slate-500">Trois conseils simples</p></div></div><div className="mt-4 space-y-3 text-sm text-slate-700"><div className="rounded-2xl bg-slate-50 p-3">Utilise un PDF propre et bien lisible.</div><div className="rounded-2xl bg-slate-50 p-3">Tu peux vérifier le texte récupéré avant de générer.</div><div className="rounded-2xl bg-slate-50 p-3">Les passages mal lus sont automatiquement écartés.</div></div></section>{library.length>0&&<section className="bg-white rounded-[2rem] border border-slate-200 p-5 shadow-soft"><div className="flex items-center justify-between gap-3"><div><h2 className="text-lg font-black">Bibliothèque</h2><p className="text-sm text-slate-500">Tes quiz déjà publiés</p></div><div className="rounded-full bg-indigo-50 px-3 py-1 text-xs font-black text-indigo-700">{library.length}</div></div><div className="mt-4 space-y-3 max-h-[520px] overflow-auto pr-1">{library.map(item=><div key={item.id} className="rounded-2xl border border-slate-200 p-4 hover:bg-slate-50 transition"><div className="font-black text-slate-900">{item.title}</div><div className="mt-1 text-xs text-slate-500">{item.count} questions · {new Date(item.createdAt).toLocaleString("fr-FR")}</div><button onClick={()=>reopen(item)} className="tap mt-3 w-full rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-black transition">▦ Réafficher le QR</button></div>)}</div></section>}</aside></div></div></main>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
