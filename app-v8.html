<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>Quizz</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a}button,input,select,textarea{font:inherit}.tap{min-height:48px}.shadow-soft{box-shadow:0 14px 35px rgba(15,23,42,.08)}:focus-visible{outline:3px solid #111827;outline-offset:3px}.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.hero-orb{position:absolute;border-radius:9999px;filter:blur(50px);opacity:.28;pointer-events:none}</style></head><body><div id="root"></div><script type="text/babel">
const {useEffect,useRef,useState}=React;
const GOOD=["Bravo ! C’est juste.","Très bien !","Excellent !","Bien joué !","Parfait !"];
const BAD=["Pas cette fois. Regarde la correction.","Bonne tentative. Lis bien l’explication.","Encore un effort, tu progresses."];
const STOP=/\b(?:de|du|des|d'|d’|le|la|les|un|une|et|ou|à|au|aux|en|par|pour|avec|sans|dans|sur|sous|que|qui|dont|comme|si|entre|vers|chez|ce|cet|cette|ces|son|sa|ses|leur|leurs)\s*[,:;]?$/i;
function norm(t){return String(t||"").normalize("NFC").replace(/\r/g,"\n").replace(/DéOinition/gi,"Définition").replace(/DeOinition/gi,"Définition").replace(/coefOicients?/gi,m=>m.toLowerCase().endsWith("s")?"coefficients":"coefficient").replace(/sufOit/gi,"suffit").replace(/signiWie/gi,"signifie").replace(/\be\s+n\b/gi,"en").replace(/\bd\s+'\s*/gi,"d’").replace(/\bl\s+'\s*/gi,"l’").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}
function line(s){return norm(s).replace(/[█■□�Ø]/g," ").replace(/\.{5,}/g," ").replace(/_{3,}/g," ").replace(/\s+([,.;:!?])/g,"$1").replace(/\s+/g," ").trim()}
function strip(s){return line(s).replace(/^\s*[►➤▶•·Ø#]+\s*/,"").replace(/^\s*\d+[.)]?\s+(?=[A-ZÀ-ÖØ-Þ])/u,"").replace(/^\s*(?:Définition|Définitions|Propriété|Méthode|Remarque|Remarques|Rappel|Rappels|Règle\s*\d*|À retenir|Point clé)\s*:\s*/i,"").trim()}
function wc(s){return (s.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’\-]*/g)||[]).length}
function suspiciousSymbols(s){const bad=(s.match(/[$%!?=#<>+*\/\\|~^]/g)||[]).length;const math=(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;return bad>=3&&bad>math*.18}
function valid(s,{short=false}={}){s=strip(s);if(!s)return null;if((short?s.length<2:s.length<20)||s.length>260)return null;if(!short&&wc(s)<4)return null;if(STOP.test(s)||/[�█■□]/.test(s)||suspiciousSymbols(s))return null;if(/\b(?:Chapitre|COURSIMAULT|2025|2026|2027)\b/i.test(s))return null;if(/[$%]{1,}|!\s*\$/g.test(s))return null;if(/^\)?\s*Le polynôme\b/i.test(s)&&/[$%!]/.test(s))return null;return s}
function noise(s){const x=line(s);return !x||/https?:\/\//i.test(x)||/\bCOURSIMAULT\b/i.test(x)||/^\d+\s+2025-2026$/i.test(x)||/^5C4\s+Chapitre/i.test(x)||/^Chapitre\s*\d+\b/i.test(x)||/^\d+\s*$/.test(x)||/^Exercice\s*\d+/i.test(x)||/^Application\s*\d*/i.test(x)||/^Exemples?\s*:?$/i.test(x)||/^Démonstration\s*:?$/i.test(x)}
function pages(text){const p=String(text).split(/\[\[PAGE:(\d+)\]\]/),out=[];if(p.length===1)return[{page:1,text}];for(let i=1;i<p.length;i+=2)out.push({page:+p[i],text:p[i+1]||""});return out}
function join(lines){const out=[];let b="";const flush=()=>{if(b){out.push(b.trim());b=""}};for(const r of lines){const x=line(r);if(noise(x))continue;if(!b){b=x;continue}if(/[.!?;:]$/.test(b)||(b+" "+x).length>300){flush();b=x}else b+=" "+x}flush();return out}
function facts(text){const out=[];for(const pg of pages(text)){for(const block of join(pg.text.split("\n"))){const type=/^Définition/i.test(block)?"definition":/^Méthode|^Règle|^Propriété|^Rappel/i.test(block)?"rule":"fact";for(let s of block.split(/(?<=[.!?])\s+/)){s=strip(s);const c=valid(s);if(!c)continue;if(type==="fact"&&!/\b(est|sont|désigne|signifie|correspond|permet|comprend|contient|consiste|se définit|a pour|ont pour|se compose|revient|on\s+(?:ajoute|recopie|applique|additionne|multiplie|supprime)|il\s+(?:suffit|faut))\b/i.test(c))continue;const key=c.toLowerCase().replace(/[^a-zà-ÿ0-9]+/gi," ").trim();if(!out.some(x=>x.key===key))out.push({key,type,content:c,page:pg.page})}}}return out}
function parseDef(s){const x=strip(s),pats=[/^(.{2,95}?)\s+(est une|est un|est le|est la|sont des|signifie|désigne|correspond à|se définit comme|consiste en|comprend|contient)\s+(.+)$/i,/^(.{2,95}?)\s+(a pour rôle de|a pour fonction de|a pour objectif de|permet de)\s+(.+)$/i];for(const p of pats){const m=x.match(p);if(m){const term=valid(m[1],{short:true}),def=valid(m[3]);if(term&&def)return{term,verb:m[2],definition:def}}}return null}
function parseProc(s){const x=strip(s);let m=x.match(/^Pour\s+(.{4,110}?),\s*(.+)$/i);if(m){const action=valid(m[1],{short:true}),ans=valid(m[2]);if(action&&ans){const A=action.toLowerCase(),B=ans.toLowerCase();if(A.includes("ajouter")&&B.includes("soustraire"))return null;if(A.includes("soustraire")&&B.includes("ajouter"))return null;return{prompt:`Que faut-il faire pour ${action} ?`,answer:ans}}}m=x.match(/^(.{3,90}?)\s+permet de\s+(.+)$/i);if(m){const term=valid(m[1],{short:true}),rest=valid(`Il permet de ${m[2]}`);if(term&&rest)return{prompt:`Que permet « ${term} » ?`,answer:rest}}return null}
function key(s){return strip(s).toLowerCase().replace(/\b(?:une|un|le|la|les|des|de|du|d|est|sont|en|mathématiques|expression|littérale|définition)\b/g," ").replace(/[^a-zà-ÿ0-9]+/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,5).join(" ")}
function overlap(a,b){const A=new Set(key(a).split(" ").filter(Boolean)),B=new Set(key(b).split(" ").filter(Boolean));let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.max(1,Math.min(A.size,B.size))}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function alts(list,answer){return sh(list.filter(x=>x!==answer&&overlap(x,answer)<.7&&valid(x))).slice(0,3)}
function build(text,count){const fs=facts(text),defs=fs.map(f=>({...f,d:parseDef(f.content)})).filter(x=>x.d&&!suspiciousSymbols(x.d.term)),procs=fs.map(f=>({...f,p:parseProc(f.content)})).filter(x=>x.p);const qs=[];const allDefs=defs.map(x=>x.d.definition),allTerms=defs.map(x=>x.d.term),allProc=procs.map(x=>x.p.answer);
for(let i=0;i<defs.length;i++){const x=defs[i],d=x.d,A=alts(allDefs,d.definition);if(A.length>=2)qs.push({id:`d-${i}`,topic:key(d.term),page:x.page,type:"definition",question:`Quelle définition correspond à « ${d.term} » ?`,options:sh([d.definition,...A]),answer:d.definition,hint:`Relis la notion « ${d.term} ».`,explanation:`${d.term} ${d.verb} ${d.definition}.`,source:x.content});const T=alts(allTerms,d.term);if(T.length>=2)qs.push({id:`t-${i}`,topic:key(d.term),page:x.page,type:"reverse",question:`Quel terme correspond à cette définition : « ${d.definition} » ?`,options:sh([d.term,...T]),answer:d.term,hint:"Relis les définitions du cours.",explanation:`La bonne réponse est « ${d.term} ».`,source:x.content})}
for(let i=0;i<procs.length;i++){const x=procs[i],A=alts(allProc,x.p.answer);if(A.length>=2)qs.push({id:`p-${i}`,topic:key(x.p.prompt),page:x.page,type:"procedure",question:x.p.prompt,options:sh([x.p.answer,...A]),answer:x.p.answer,hint:"Relis la méthode ou la règle correspondante.",explanation:x.content,source:x.content})}
const clean=qs.filter(q=>valid(q.question.replace(/^Quelle définition correspond à «|» \?$/g,"notion complète"),{short:true})&&q.options.every(o=>valid(o,{short:true}))&&!suspiciousSymbols(q.question));const chosen=[],usedTopic=new Set(),usedPages=new Map();while(chosen.length<count){let best=null,score=-1e9;for(const q of clean){if(chosen.includes(q)||usedTopic.has(q.topic))continue;const s=10-(usedPages.get(q.page)||0)*3+(q.type==="definition"?3:q.type==="procedure"?2:1)+Math.random();if(s>score){score=s;best=q}}if(!best)break;chosen.push(best);usedTopic.add(best.topic);usedPages.set(best.page,(usedPages.get(best.page)||0)+1)}
if(chosen.length<count){for(const q of sh(clean)){if(chosen.length>=count)break;if(chosen.includes(q))continue;const sameTopic=chosen.filter(x=>x.topic===q.topic);if(sameTopic.length>=2)continue;if(sameTopic.length===1&&sameTopic[0].type===q.type)continue;chosen.push(q)}}
if(chosen.length<5)throw new Error("Je ne trouve pas assez de questions fiables dans ce document.");return{questions:chosen.slice(0,count),found:fs.length,pages:new Set(fs.map(f=>f.page)).size}}
async function extractPageText(page){const tc=await page.getTextContent();const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str,x:x.transform?.[4]||0,y:x.transform?.[5]||0})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);const lines=[];let row=[],last=null;for(const it of items){if(last===null||Math.abs(it.y-last)<=2.5)row.push(it);else{if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));row=[it]}last=it.y}if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));return norm(lines.join("\n"))}
async function extractPdfText(file,onProgress){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];for(let p=1;p<=pdf.numPages;p++){onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);const page=await pdf.getPage(p);let text=await extractPageText(page);if(text.length<80){const vp=page.getViewport({scale:1.5}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const r=await Tesseract.recognize(c,"fra");text=norm(r.data.text||"")}out.push(`[[PAGE:${p}]]\n${text}`)}return out.join("\n\n")}
async function publishQuiz(payload){const r=await fetch("/api/save-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Publication impossible.");return d.id}
async function loadQuiz(id){const r=await fetch(`/api/get-quiz?id=${encodeURIComponent(id)}`),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Quiz introuvable.");return d}
async function loadLibrary(){const r=await fetch("/api/list-quizzes"),d=await r.json().catch(()=>({}));return Array.isArray(d.items)?d.items:[]}
function studentUrl(id){const u=new URL(location.href);u.pathname="/";u.search="";u.searchParams.set("quiz",id);return u.toString()}
function App(){const studentId=new URLSearchParams(location.search).get("quiz"),[mode,setMode]=useState(studentId?"loading":"teacher"),[title,setTitle]=useState("Quizz"),[count,setCount]=useState(10),[course,setCourse]=useState(""),[filename,setFilename]=useState(""),[busy,setBusy]=useState(""),[error,setError]=useState(""),[notice,setNotice]=useState(""),[quiz,setQuiz]=useState([]),[url,setUrl]=useState(""),[library,setLibrary]=useState([]),[idx,setIdx]=useState(0),[selected,setSelected]=useState(""),[feedback,setFeedback]=useState(null),[hint,setHint]=useState(false),[answers,setAnswers]=useState({});const qrRef=useRef(null),current=quiz[idx],score=Object.values(answers).filter(x=>x.correct).length;useEffect(()=>{if(studentId){loadQuiz(studentId).then(d=>{setTitle(d.title||"Quizz");setQuiz(d.questions||[]);setMode("intro")}).catch(e=>{setError(e.message);setMode("error")})}else loadLibrary().then(setLibrary).catch(()=>{})},[]);useEffect(()=>{if(mode==="published"&&url&&qrRef.current){qrRef.current.innerHTML="";new QRCode(qrRef.current,{text:url,width:260,height:260})}},[mode,url]);async function importFile(e){const f=e.target.files?.[0];if(!f)return;setFilename(f.name);setError("");setNotice("");try{setBusy("Lecture du document…");if(f.type==="application/pdf"||/\.pdf$/i.test(f.name))setCourse(await extractPdfText(f,setBusy));else if(f.type.startsWith("image/")){const r=await Tesseract.recognize(f,"fra");setCourse(`[[PAGE:1]]\n${norm(r.data.text||"")}`)}else setCourse(`[[PAGE:1]]\n${norm(await f.text())}`);setBusy("")}catch(e){setBusy("");setError(e.message);setCourse("")}}async function createQuiz(){setError("");setNotice("");try{if(!course)throw new Error("Importe d’abord ton cours.");setBusy("Analyse du cours…");const r=build(course,count),qs=r.questions;setNotice(qs.length<count?`${qs.length} questions fiables générées sur ${count} demandées.`:`${qs.length} questions générées à partir de ${r.found} éléments fiables.`);setBusy("Publication…");const id=await publishQuiz({app:"quizz",version:8,title,createdAt:new Date().toISOString(),questions:qs});setQuiz(qs);setUrl(studentUrl(id));setBusy("");setMode("published");loadLibrary().then(setLibrary).catch(()=>{})}catch(e){setBusy("");setError(e.message)}}function start(){setIdx(0);setSelected("");setFeedback(null);setHint(false);setAnswers({});setMode("quiz")}function validate(){if(!selected||feedback)return;const ok=selected===current.answer;setAnswers(a=>({...a,[current.id]:{correct:ok,selected}}));setFeedback({correct:ok,text:ok?GOOD[(idx+score)%GOOD.length]:BAD[(idx+score)%BAD.length]})}function next(){if(idx+1>=quiz.length){setMode("results");scrollTo(0,0)}else{setIdx(x=>x+1);setSelected("");setFeedback(null);setHint(false);scrollTo(0,0)}}async function reopen(item){try{const d=await loadQuiz(item.id);setQuiz(d.questions||[]);setTitle(d.title||item.title);setUrl(studentUrl(item.id));setMode("published")}catch(e){setError(e.message)}}

if(mode==="results"){const pct=quiz.length?Math.round(score/quiz.length*100):0,missed=quiz.filter(q=>!answers[q.id]?.correct);return <main className="min-h-screen p-4 bg-gradient-to-br from-emerald-50 via-white to-indigo-50"><div className="max-w-3xl mx-auto"><section className="bg-white rounded-[2rem] p-7 text-center border shadow-soft"><h1 className="text-4xl font-black">{score}/{quiz.length}</h1><p className="text-xl font-bold mt-1">{pct}%</p></section><section className="mt-5 bg-white rounded-3xl p-5 border"><h2 className="text-xl font-black">Points à revoir</h2><div className="mt-4 space-y-3">{missed.length?missed.map((q,i)=><details key={q.id} className="p-4 border rounded-2xl"><summary className="font-black">{i+1}. {q.question}</summary><p className="mt-2"><strong>Bonne réponse :</strong> {q.answer}</p></details>):<p className="bg-emerald-50 p-4 rounded-2xl font-bold">Aucune erreur. Bravo !</p>}</div></section><button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Refaire le quiz</button></div></main>}

e de questions<select value={count} onChange={e=>setCount(+e.target.value)} className="tap mt-2 w-full rounded-2xl border px-4">{[10,15,20,25,30].map(n=><option key={n}>{n} questions</option>)}</select></label><label className="font-black">Titre<input value={title} onChange={e=>setTitle(e.target.value.slice(0,70))} className="tap mt-2 w-full rounded-2xl border px-4"/></label></div><button onClick={createQuiz} disabled={!course||!!busy} className="tap mt-6 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black text-lg">✨ Créer le quiz & le QR</button><details className="mt-5 rounded-2xl border bg-slate-50 p-4"><summary className="font-black cursor-pointer">📝 Voir le texte récupéré</summary><textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-64 rounded-xl border p-3 text-sm"/></details></section><aside className="space-y-6"><section className="bg-white rounded-[2rem] border p-5 shadow-soft"><h2 className="font-black">💡 Pour un meilleur résultat</h2><div className="mt-4 space-y-2 text-sm text-slate-700"><div className="bg-slate-50 rounded-xl p-3">Les chaînes OCR suspectes sont maintenant rejetées.</div><div className="bg-slate-50 rounded-xl p-3">Les incohérences ajouter/soustraire sont bloquées.</div><div className="bg-slate-50 rounded-xl p-3">Le moteur complète avec une autre forme de question pour atteindre le nombre demandé.</div></div></section>{library.length>0&&<section className="bg-white rounded-[2rem] border p-5 shadow-soft"><h2 className="font-black">Bibliothèque</h2><div className="mt-4 space-y-3 max-h-[520px] overflow-auto">{library.map(item=><div key={item.id} className="rounded-2xl border p-4"><div className="font-black">{item.title}</div><div className="mt-1 text-xs text-slate-500">{item.count} questions · {new Date(item.createdAt).toLocaleString("fr-FR")}</div><button onClick={()=>reopen(item)} className="tap mt-3 w-full rounded-xl bg-indigo-50 text-indigo-900 font-black">Réafficher le QR</button></div>)}</div></section>}</aside></div></div></main>}
