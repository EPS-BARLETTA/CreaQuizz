<script type="text/babel">
const {useEffect,useRef,useState}=React;

// Stockage public anonyme du quiz publié.
// Aucune donnée nominative élève n'est envoyée.
const STORAGE_API="https://superjsonblob.com/api/jsonBlob";

const GOOD=[
  "Bravo ! C’est juste.",
  "Très bien !",
  "Excellent, continue comme ça !",
  "Bien joué !",
  "Parfait !"
];

const BAD=[
  "Pas cette fois. Regarde l’explication.",
  "Bonne tentative. Retenons la règle.",
  "Ce n’est pas grave, la correction va t’aider.",
  "Encore un petit effort, tu progresses."
];

function Icon({name,size=20}){
  const ref=useRef(null);
  useEffect(()=>{
    if(ref.current&&window.lucide){
      ref.current.innerHTML=`<i data-lucide="${name}"></i>`;
      window.lucide.createIcons({attrs:{width:size,height:size,"aria-hidden":"true"}});
    }
  },[name,size]);
  return <span ref={ref} className="inline-flex shrink-0" aria-hidden="true"/>;
}

function Toast({value,onClose}){
  useEffect(()=>{
    if(!value)return;
    const id=setTimeout(onClose,4500);
    return()=>clearTimeout(id);
  },[value]);
  if(!value)return null;
  return <div className="fixed z-50 left-3 right-3 bottom-4 flex justify-center" aria-live="polite">
    <div className={`max-w-lg w-full rounded-2xl border px-4 py-3 shadow-soft font-semibold flex gap-3 ${
      value.type==="error"?"bg-rose-50 border-rose-200 text-rose-900":
      value.type==="success"?"bg-emerald-50 border-emerald-200 text-emerald-900":
      "bg-white border-slate-200"
    }`}>
      <Icon name={value.type==="error"?"circle-alert":value.type==="success"?"circle-check":"info"}/>
      <span>{value.text}</span>
    </div>
  </div>
}

function normalizeText(t){
  return String(t||"")
    .replace(/\r/g,"\n")
    .replace(/DéOinition/gi,"Définition")
    .replace(/DeOinition/gi,"Définition")
    .replace(/Définition/gi,"Définition")
    .replace(/Propriété/gi,"Propriété")
    .replace(/Méthode/gi,"Méthode")
    .replace(/Règle/gi,"Règle")
    .replace(/coefOicient/gi,"coefficient")
    .replace(/coefOicients/gi,"coefficients")
    .replace(/sufOit/gi,"suffit")
    .replace(/signiWie/gi,"signifie")
    .replace(/binôme/gi,"binôme")
    .replace(/monôme/gi,"monôme")
    .replace(/[ \t]+/g," ")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function cleanLine(s){
  return normalizeText(s)
    .replace(/[Ø]/g," ")
    .replace(/\.{5,}/g," ")
    .replace(/_{3,}/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function usefulFrench(s){
  if(!s||s.length<18||s.length>260)return false;
  const letters=(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
  if(letters<14)return false;
  const junk=(s.match(/[█■□�]{1,}/g)||[]).length;
  if(junk>0)return false;
  return true;
}

function textQuality(s){
  if(!s)return 0;
  const letters=(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
  const junk=(s.match(/[�█■□]|\.{6,}/g)||[]).length;
  const words=s.split(/\s+/).filter(w=>/[A-Za-zÀ-ÿ]{3,}/.test(w)).length;
  return letters + words*4 - junk*25;
}

/* =========================================================
   IMPORT PDF ROBUSTE
========================================================= */

async function extractPageText(page){
  const tc=await page.getTextContent();
  const items=tc.items
    .filter(x=>x.str&&x.str.trim())
    .map(x=>({
      str:x.str,
      x:x.transform?.[4]||0,
      y:x.transform?.[5]||0
    }))
    .sort((a,b)=>{
      if(Math.abs(b.y-a.y)>2)return b.y-a.y;
      return a.x-b.x;
    });

  const lines=[];
  let current=[];
  let lastY=null;

  for(const item of items){
    if(lastY===null||Math.abs(item.y-lastY)<=2.5){
      current.push(item);
    }else{
      if(current.length){
        lines.push(current.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));
      }
      current=[item];
    }
    lastY=item.y;
  }
  if(current.length){
    lines.push(current.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" "));
  }

  return normalizeText(lines.join("\n"));
}

async function ocrPdfPage(page,pageNo,total,onProgress){
  if(!window.Tesseract) return "";

  const viewport=page.getViewport({scale:1.55});
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  canvas.width=Math.ceil(viewport.width);
  canvas.height=Math.ceil(viewport.height);

  await page.render({canvasContext:ctx,viewport}).promise;

  const result=await Tesseract.recognize(canvas,"fra",{
    logger:m=>{
      if(m.status==="recognizing text"){
        onProgress(`OCR page ${pageNo}/${total} · ${Math.round((m.progress||0)*100)} %`);
      }
    }
  });

  return normalizeText(result?.data?.text||"");
}

async function extractPdfText(file,onProgress){
  if(!window.pdfjsLib){
    throw new Error("Le lecteur PDF n’a pas pu être chargé. Recharge la page puis réessaie.");
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdf;
  try{
    pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  }catch(e){
    throw new Error("Ce PDF n’a pas pu être ouvert. Réexporte-le depuis Notability au format PDF standard.");
  }

  const pages=[];

  for(let p=1;p<=pdf.numPages;p++){
    onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);
    const page=await pdf.getPage(p);

    let extracted=await extractPageText(page);

    // OCR seulement si le texte de la page est trop pauvre ou manifestement cassé.
    if(extracted.length<80||textQuality(extracted)<180){
      const ocr=await ocrPdfPage(page,p,pdf.numPages,onProgress);
      if(textQuality(ocr)>textQuality(extracted)){
        extracted=ocr;
      }
    }

    if(extracted.trim())pages.push(extracted);
  }

  const full=normalizeText(pages.join("\n\n"));

  if(full.length<120){
    throw new Error("Le PDF a bien été ouvert, mais je n’arrive pas à récupérer assez de texte. Essaie un export PDF standard depuis Notability ou une image nette.");
  }

  return full;
}

/* =========================================================
   EXTRACTION DES NOTIONS DU COURS
========================================================= */

function extractCourseItems(text){
  let t=normalizeText(text);

  // Marqueurs souvent collés au texte dans les PDF Notability.
  t=t
    .replace(/\s+(Définition\s*:)/gi,"\n$1")
    .replace(/\s+(Définitions\s*:)/gi,"\n$1")
    .replace(/\s+(Propriété\s*:)/gi,"\n$1")
    .replace(/\s+(Méthode\s*:)/gi,"\n$1")
    .replace(/\s+(Règle\s*\d*\s*:)/gi,"\n$1")
    .replace(/\s+(Rappel\s*:)/gi,"\n$1")
    .replace(/\s+(Remarque\s*:)/gi,"\n$1");

  const rawLines=t.split("\n").map(cleanLine).filter(Boolean);
  const items=[];

  function add(type,content){
    content=cleanLine(content)
      .replace(/\s+(?:Exercice|Application|Dans Amplitude|Exemples?\s*:).*$/i,"")
      .trim();

    if(!usefulFrench(content))return;

    const key=(type+"|"+content.toLowerCase()).slice(0,240);
    if(!items.some(x=>x.key===key)){
      items.push({key,type,content});
    }
  }

  for(let i=0;i<rawLines.length;i++){
    const line=rawLines[i];

    let m=line.match(/^(Définition|Définitions)\s*:\s*(.+)$/i);
    if(m){ add("definition",m[2]); continue; }

    m=line.match(/^Propriété\s*:\s*(.+)$/i);
    if(m){ add("property",m[1]); continue; }

    m=line.match(/^Méthode\s*:\s*(.+)$/i);
    if(m){ add("method",m[1]); continue; }

    m=line.match(/^Règle\s*\d*\s*:\s*(.+)$/i);
    if(m){ add("rule",m[1]); continue; }

    m=line.match(/^Rappel\s*:\s*(.+)$/i);
    if(m){ add("reminder",m[1]); continue; }

    // Cas réels du PDF fourni : phrases utiles sans marqueur.
    if(/^(Un monôme est|Une expression littérale s'écrit|La valeur numérique d'une expression littérale est|Des binômes conjugués sont|La distributivité simple permet|Le carré d'une somme|Le carré d'une différence|Le produit de deux binômes conjugués)/i.test(line)){
      add(/ est | sont /i.test(line)?"definition":"property",line);
      continue;
    }

    if(/^(Pour réduire|Pour additionner|Pour soustraire|Pour calculer un produit algébrique|Pour supprimer des parenthèses)/i.test(line)){
      add("method",line);
      continue;
    }

    // Phrases de définition/méthode sémantiquement propres.
    if(/est une expression|est le nombre obtenu|est égal à|signifie transformer|on additionne les termes semblables|on recopie les termes|on applique la distributivité/i.test(line)){
      add(/est une|est le nombre|signifie/i.test(line)?"definition":"property",line);
    }
  }

  return items.map(({key,...rest})=>rest);
}

function parseDefinition(s){
  const patterns=[
    /^(.{2,90}?)\s+(est une|est un|est le|sont des|signifie|désigne)\s+(.+)$/i,
    /^Dans .+?,\s*(.{2,80}?)\s+(sont)\s+(.+)$/i
  ];
  for(const p of patterns){
    const m=s.match(p);
    if(m)return {term:m[1].trim(),verb:m[2].trim(),definition:m[3].trim()};
  }
  return null;
}

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function buildQuiz(text,count){
  const items=extractCourseItems(text);

  const definitions=items
    .map(x=>({...x,parsed:parseDefinition(x.content)}))
    .filter(x=>x.parsed&&usefulFrench(x.parsed.definition));

  const rules=items
    .filter(x=>["method","rule","property","reminder"].includes(x.type))
    .filter(x=>usefulFrench(x.content));

  if(definitions.length+rules.length<4){
    throw new Error("Le PDF est bien importé, mais je ne trouve pas encore assez de notions propres pour fabriquer un QCM fiable.");
  }

  const questions=[];

  // Définitions : terme -> définition
  definitions.forEach((d,i)=>{
    const alternatives=shuffle(
      definitions
        .filter((_,j)=>j!==i)
        .map(x=>x.parsed.definition)
        .filter(x=>x.length<170)
    ).slice(0,3);

    if(alternatives.length<2)return;

    questions.push({
      id:`d1-${i}`,
      question:`Quelle définition correspond à « ${d.parsed.term} » ?`,
      options:shuffle([d.parsed.definition,...alternatives]),
      answer:d.parsed.definition,
      hint:`Cherche dans le cours la définition de « ${d.parsed.term} ».`,
      explanation:`${d.parsed.term} ${d.parsed.verb} ${d.parsed.definition}.`,
      source:d.content
    });
  });

  // Définitions : définition -> terme
  definitions.forEach((d,i)=>{
    const alternatives=shuffle(
      definitions.filter((_,j)=>j!==i).map(x=>x.parsed.term)
    ).slice(0,3);

    if(alternatives.length<2)return;

    questions.push({
      id:`d2-${i}`,
      question:`Quel terme correspond à cette définition : « ${d.parsed.definition} » ?`,
      options:shuffle([d.parsed.term,...alternatives]),
      answer:d.parsed.term,
      hint:"Relis les définitions du cours.",
      explanation:`La bonne réponse est « ${d.parsed.term} ».`,
      source:d.content
    });
  });

  // Méthodes / règles.
  rules.forEach((r,i)=>{
    const alternatives=shuffle(
      rules.filter((_,j)=>j!==i).map(x=>x.content).filter(x=>x.length<180)
    ).slice(0,3);

    if(alternatives.length<2)return;

    let question="Quelle affirmation est correcte d’après le cours ?";
    const s=r.content;

    if(/réduire une expression/i.test(s)){
      question="Comment réduit-on une expression littérale ?";
    }else if(/produit algébrique.*monômes/i.test(s)){
      question="Comment calcule-t-on un produit algébrique de monômes ?";
    }else if(/parenthèses.*signe \+/i.test(s)){
      question="Que fait-on pour supprimer des parenthèses précédées d’un signe + ?";
    }else if(/parenthèses.*signe -/i.test(s)){
      question="Que fait-on pour supprimer des parenthèses précédées d’un signe − ?";
    }else if(/binômes conjugués/i.test(s)){
      question="Quelle propriété sur les binômes conjugués est correcte ?";
    }else if(/carré d'une somme/i.test(s)){
      question="Quelle propriété décrit le carré d’une somme ?";
    }else if(/carré d'une différence/i.test(s)){
      question="Quelle propriété décrit le carré d’une différence ?";
    }

    questions.push({
      id:`r-${i}`,
      question,
      options:shuffle([s,...alternatives]),
      answer:s,
      hint:"Relis la règle ou la propriété correspondante dans le cours.",
      explanation:s,
      source:s
    });
  });

  // Vrai / faux uniquement sur des énoncés propres.
  definitions.slice(0,6).forEach((d,i)=>{
    questions.push({
      id:`tf-${i}`,
      question:`Vrai ou faux : « ${d.content} »`,
      options:["Vrai","Faux"],
      answer:"Vrai",
      hint:`Relis la définition de « ${d.parsed.term} ».`,
      explanation:"Cette phrase correspond bien au cours.",
      source:d.content
    });
  });

  const seen=new Set();
  const clean=questions.filter(q=>{
    const k=q.question.toLowerCase();
    if(seen.has(k))return false;
    seen.add(k);
    if(q.options.some(o=>!usefulFrench(o)&&!["Vrai","Faux"].includes(o)))return false;
    return true;
  });

  if(clean.length<5){
    throw new Error("Le cours est importé, mais les notions extraites ne sont pas assez propres pour générer un QCM correct.");
  }

  const out=[];
  let i=0;
  while(out.length<count){
    const base=clean[i%clean.length];
    out.push({...base,id:`${base.id}-${out.length}`});
    i++;
    if(i>200)break;
  }

  return shuffle(out).slice(0,count);
}

/* =========================================================
   PUBLICATION / QR
========================================================= */

async function publishQuiz(payload){
  const res=await fetch(STORAGE_API,{
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify(payload)
  });
  if(!res.ok)throw new Error("Le quiz a été créé, mais sa publication en ligne a échoué.");
  const data=await res.json();
  if(!data.id)throw new Error("Le service de publication n’a pas renvoyé d’identifiant.");
  return data.id;
}

async function loadQuiz(id){
  const res=await fetch(`${STORAGE_API}/${encodeURIComponent(id)}`,{
    headers:{"Accept":"application/json"}
  });
  if(!res.ok)throw new Error("Quiz introuvable.");
  return await res.json();
}

function studentUrl(id){
  const u=new URL(location.href);
  u.search="";
  u.hash="";
  u.searchParams.set("quiz",id);
  return u.toString();
}

function saveLibrary(entry){
  try{
    const list=JSON.parse(localStorage.getItem("qm-library-v3")||"[]");
    const next=[entry,...list.filter(x=>x.id!==entry.id)].slice(0,30);
    localStorage.setItem("qm-library-v3",JSON.stringify(next));
    return next;
  }catch{return[entry]}
}

function readLibrary(){
  try{return JSON.parse(localStorage.getItem("qm-library-v3")||"[]")}
  catch{return[]}
}

/* =========================================================
   APPLICATION
========================================================= */

function App(){
  const studentId=new URLSearchParams(location.search).get("quiz");

  const [mode,setMode]=useState(studentId?"student-loading":"teacher");
  const [title,setTitle]=useState("Quizz Maths");
  const [count,setCount]=useState(15);
  const [course,setCourse]=useState("");
  const [filename,setFilename]=useState("");
  const [busy,setBusy]=useState("");
  const [toast,setToast]=useState(null);
  const [quiz,setQuiz]=useState([]);
  const [publishedUrl,setPublishedUrl]=useState("");
  const [library,setLibrary]=useState(readLibrary());

  const [index,setIndex]=useState(0);
  const [selected,setSelected]=useState("");
  const [feedback,setFeedback]=useState(null);
  const [showHint,setShowHint]=useState(false);
  const [answers,setAnswers]=useState({});

  const qrRef=useRef(null);
  const current=quiz[index];
  const correct=Object.values(answers).filter(x=>x.correct).length;

  useEffect(()=>{
    if(!studentId)return;
    (async()=>{
      try{
        const data=await loadQuiz(studentId);
        if(!Array.isArray(data.questions))throw new Error("Quiz invalide.");
        setTitle(data.title||"Quizz Maths");
        setQuiz(data.questions);
        setMode("student-intro");
      }catch(e){
        setMode("student-error");
        setToast({type:"error",text:e.message});
      }
    })();
  },[]);

  useEffect(()=>{
    if(mode!=="published"||!publishedUrl||!qrRef.current)return;
    qrRef.current.innerHTML="";
    new QRCode(qrRef.current,{
      text:publishedUrl,
      width:260,
      height:260,
      correctLevel:QRCode.CorrectLevel.M
    });
  },[mode,publishedUrl]);

  async function importFile(e){
    const f=e.target.files?.[0];
    if(!f)return;
    setFilename(f.name);

    try{
      if(f.type==="application/pdf"||f.name.toLowerCase().endsWith(".pdf")){
        setBusy("Ouverture du PDF…");
        const text=await extractPdfText(f,setBusy);
        setCourse(text);
        setBusy("");
        setToast({type:"success",text:`PDF importé : ${text.length.toLocaleString("fr-FR")} caractères récupérés.`});
        return;
      }

      if(f.type.startsWith("image/")){
        setBusy("Lecture de l’image…");
        const result=await Tesseract.recognize(f,"fra",{
          logger:m=>{
            if(m.status==="recognizing text"){
              setBusy(`Lecture de l’image : ${Math.round((m.progress||0)*100)} %`);
            }
          }
        });
        const text=normalizeText(result.data.text||"");
        if(text.length<80)throw new Error("Je n’arrive pas à lire assez de texte sur cette image.");
        setCourse(text);
        setBusy("");
        setToast({type:"success",text:"Image importée."});
        return;
      }

      if(f.type.startsWith("text/")||/\.(txt|md|csv)$/i.test(f.name)){
        setCourse(normalizeText(await f.text()));
        setToast({type:"success",text:"Fichier importé."});
        return;
      }

      throw new Error("Format non pris en charge.");
    }catch(err){
      setBusy("");
      setCourse("");
      setToast({type:"error",text:err.message||"Import impossible."});
    }
  }

  async function createQuiz(){
    try{
      if(!course.trim())throw new Error("Importe d’abord ton cours.");

      setBusy("Création du QCM…");
      const questions=buildQuiz(course,count);

      setBusy("Publication du quiz…");
      const id=await publishQuiz({
        app:"quizz-maths",
        version:3,
        title,
        createdAt:new Date().toISOString(),
        questions
      });

      const url=studentUrl(id);
      setQuiz(questions);
      setPublishedUrl(url);

      setLibrary(saveLibrary({
        id,
        title,
        url,
        count:questions.length,
        createdAt:new Date().toISOString()
      }));

      setBusy("");
      setMode("published");
      setToast({type:"success",text:"Quiz créé. Le QR élève est prêt."});
    }catch(e){
      setBusy("");
      setToast({type:"error",text:e.message});
    }
  }

  function startQuiz(){
    setIndex(0);
    setSelected("");
    setFeedback(null);
    setShowHint(false);
    setAnswers({});
    setMode("student-quiz");
  }

  function validate(){
    if(!selected||feedback||!current)return;
    const ok=selected===current.answer;
    setAnswers(a=>({...a,[current.id]:{correct:ok,selected}}));
    setFeedback({
      correct:ok,
      text:ok
        ? GOOD[(index+correct)%GOOD.length]
        : BAD[(index+correct)%BAD.length]
    });
  }

  function next(){
    if(index+1>=quiz.length){
      setMode("student-results");
      window.scrollTo(0,0);
      return;
    }
    setIndex(v=>v+1);
    setSelected("");
    setFeedback(null);
    setShowHint(false);
    window.scrollTo({top:0,behavior:"smooth"});
  }

  async function reopen(item){
    try{
      setBusy("Chargement…");
      const data=await loadQuiz(item.id);
      setQuiz(data.questions||[]);
      setTitle(data.title||item.title);
      setPublishedUrl(item.url);
      setBusy("");
      setMode("published");
    }catch(e){
      setBusy("");
      setToast({type:"error",text:e.message});
    }
  }

  /* ---------------- étudiant ---------------- */

  if(mode==="student-loading"){
    return <main className="min-h-screen grid place-items-center px-4">
      <div className="text-center">
        <div className="w-16 h-16 mx-auto rounded-2xl bg-indigo-100 text-indigo-700 grid place-items-center"><Icon name="loader-circle" size={34}/></div>
        <h1 className="mt-4 text-2xl font-black">Chargement du quiz…</h1>
      </div>
    </main>
  }

  if(mode==="student-error"){
    return <main className="min-h-screen grid place-items-center px-4">
      <section className="max-w-md bg-white border border-rose-200 rounded-3xl p-6 text-center shadow-soft">
        <h1 className="text-2xl font-black">Quiz indisponible</h1>
        <p className="mt-2 text-slate-600">Le QR ou le lien n’est plus accessible.</p>
      </section>
      <Toast value={toast} onClose={()=>setToast(null)}/>
    </main>
  }

  if(mode==="student-intro"){
    return <main className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-fuchsia-50 px-4 py-8 grid place-items-center">
      <section className="max-w-xl w-full bg-white border border-slate-200 rounded-[2rem] p-8 text-center shadow-soft">
        <div className="w-20 h-20 mx-auto rounded-3xl bg-indigo-100 text-indigo-700 grid place-items-center"><Icon name="brain-circuit" size={42}/></div>
        <p className="mt-5 uppercase tracking-[.18em] text-xs font-black text-indigo-700">Mathématiques</p>
        <h1 className="text-3xl font-black mt-2">{title}</h1>
        <p className="mt-3 text-slate-600">{quiz.length} questions · indice disponible · bilan final</p>
        <button onClick={startQuiz} className="tap mt-7 w-full rounded-2xl bg-indigo-700 text-white font-black text-lg flex justify-center items-center gap-2">
          <Icon name="play"/> Commencer
        </button>
      </section>
    </main>
  }

  if(mode==="student-quiz"&&current){
    const progress=Math.round(((index+1)/quiz.length)*100);

    return <main className="min-h-screen bg-slate-50">
      <header className="sticky top-0 z-20 bg-white/95 backdrop-blur border-b">
        <div className="max-w-2xl mx-auto px-4 py-3">
          <div className="flex justify-between text-sm font-black">
            <span>Question {index+1}/{quiz.length}</span>
            <span>{correct} juste{correct>1?"s":""}</span>
          </div>
          <div className="mt-2 h-2 rounded-full bg-slate-200 overflow-hidden">
            <div className="h-full bg-indigo-600" style={{width:`${progress}%`}}/>
          </div>
        </div>
      </header>

      <div className="max-w-2xl mx-auto px-4 py-6">
        <section className="bg-white border border-slate-200 rounded-3xl p-5 sm:p-7 shadow-soft">
          <h1 className="text-xl sm:text-2xl font-black leading-snug">{current.question}</h1>

          {!feedback&&<>
            <fieldset className="mt-6 space-y-3">
              <legend className="sr-only">Choisis une réponse</legend>
              {current.options.map((opt,i)=>{
                const active=selected===opt;
                return <label key={i} className={`tap rounded-2xl border-2 p-4 flex gap-3 items-start cursor-pointer font-bold ${active?"border-indigo-600 bg-indigo-50":"border-slate-200 bg-white"}`}>
                  <input type="radio" name="answer" checked={active} onChange={()=>setSelected(opt)} className="mt-1 w-5 h-5 accent-indigo-700"/>
                  <span>{opt}</span>
                </label>
              })}
            </fieldset>

            <button onClick={()=>setShowHint(v=>!v)} className="tap mt-5 w-full rounded-2xl border-2 border-amber-200 bg-amber-50 text-amber-950 font-black flex items-center justify-center gap-2">
              <Icon name="lightbulb"/> {showHint?"Masquer l’indice":"Indice du cours"}
            </button>

            {showHint&&<div className="mt-3 rounded-2xl bg-amber-50 border border-amber-200 p-4 text-amber-950">
              <strong>Indice :</strong> {current.hint}
            </div>}

            <button onClick={validate} disabled={!selected} className="tap mt-3 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black">
              Valider ma réponse
            </button>
          </>}

          {feedback&&<div className={`mt-6 rounded-3xl border p-5 ${feedback.correct?"bg-emerald-50 border-emerald-200 text-emerald-950":"bg-rose-50 border-rose-200 text-rose-950"}`}>
            <div className="text-lg font-black">{feedback.text}</div>
            {!feedback.correct&&<p className="mt-3"><strong>Bonne réponse :</strong> {current.answer}</p>}
            <p className="mt-3"><strong>À retenir :</strong> {current.explanation}</p>

            <details className="mt-4 rounded-2xl bg-white/70 border border-current/10 p-4">
              <summary className="cursor-pointer font-black">📘 Voir l’extrait du cours</summary>
              <p className="mt-2 text-sm">{current.source}</p>
            </details>

            <button onClick={next} className="tap mt-5 w-full rounded-2xl bg-slate-900 text-white font-black flex items-center justify-center gap-2">
              {index+1===quiz.length?"Voir mon bilan":"Question suivante"} <Icon name="arrow-right"/>
            </button>
          </div>}
        </section>
      </div>
    </main>
  }

  if(mode==="student-results"){
    const percent=quiz.length?Math.round(correct/quiz.length*100):0;
    const missed=quiz.filter(q=>!answers[q.id]?.correct);

    return <main className="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-indigo-50 px-4 py-7">
      <div className="max-w-3xl mx-auto">
        <section className="bg-white border border-slate-200 rounded-[2rem] p-7 text-center shadow-soft">
          <div className="w-20 h-20 mx-auto rounded-full bg-emerald-100 text-emerald-800 grid place-items-center"><Icon name="trophy" size={42}/></div>
          <h1 className="text-4xl font-black mt-4">{correct}/{quiz.length}</h1>
          <p className="text-xl font-bold mt-1">{percent}%</p>
          <p className="mt-3 text-slate-600">
            {percent>=80?"Très bon travail !":
             percent>=60?"C’est bien. Encore quelques points à consolider.":
             "Relis les points à revoir puis retente le quiz."}
          </p>
        </section>

        <section className="mt-5 bg-white border border-slate-200 rounded-3xl p-5 shadow-soft">
          <h2 className="text-xl font-black">Points à revoir</h2>
          {missed.length===0
            ? <p className="mt-3 rounded-2xl bg-emerald-50 p-4 text-emerald-900 font-bold">Aucune erreur. Bravo !</p>
            : <div className="mt-4 space-y-3">
                {missed.map((q,i)=><details key={q.id} className="rounded-2xl border border-slate-200 p-4">
                  <summary className="font-black cursor-pointer">{i+1}. {q.question}</summary>
                  <p className="mt-3 text-sm"><strong>Bonne réponse :</strong> {q.answer}</p>
                  <p className="mt-2 text-sm">{q.explanation}</p>
                </details>)}
              </div>
          }
        </section>

        <button onClick={startQuiz} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black flex justify-center items-center gap-2">
          <Icon name="rotate-ccw"/> Refaire le quiz
        </button>
      </div>
    </main>
  }

  /* ---------------- prof : QR ---------------- */

  if(mode==="published"){
    return <main className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-emerald-50 px-4 py-6">
      <div className="max-w-3xl mx-auto">
        <button onClick={()=>setMode("teacher")} className="tap rounded-xl px-3 font-bold flex items-center gap-2"><Icon name="arrow-left"/> Nouveau quiz</button>

        <section className="mt-3 bg-white border border-slate-200 rounded-[2rem] p-7 text-center shadow-soft">
          <div className="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 text-emerald-800 grid place-items-center"><Icon name="qr-code" size={34}/></div>
          <h1 className="text-3xl font-black mt-4">{title}</h1>
          <p className="mt-2 text-slate-600">{quiz.length} questions · QR élève prêt</p>

          <div ref={qrRef} className="mt-6 mx-auto w-[260px] min-h-[260px] grid place-items-center"></div>

          <p className="mt-4 text-sm text-slate-600">L’élève scanne et arrive directement sur le quiz.</p>

          <button onClick={startQuiz} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black flex items-center justify-center gap-2">
            <Icon name="play"/> Tester le quiz
          </button>
        </section>
      </div>
      <Toast value={toast} onClose={()=>setToast(null)}/>
    </main>
  }

  /* ---------------- prof : accueil ---------------- */

  return <main className="min-h-screen">
    <header className="bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white">
      <div className="max-w-4xl mx-auto px-4 py-8 sm:py-10">
        <h1 className="text-3xl sm:text-4xl font-black">Quizz Maths</h1>
        <p className="mt-2 text-indigo-100">Importe ton cours → choisis le nombre de questions → crée le quiz & le QR.</p>
      </div>
    </header>

    <div className="max-w-4xl mx-auto px-4 py-6">
      <section className="bg-white border border-slate-200 rounded-3xl p-5 sm:p-7 shadow-soft">
        <h2 className="text-xl font-black">1. Importer le cours</h2>

        <label className="tap mt-4 w-full rounded-2xl border-2 border-dashed border-indigo-300 bg-indigo-50 hover:bg-indigo-100 cursor-pointer px-4 py-6 flex items-center justify-center gap-3 text-indigo-900 font-black">
          <Icon name="upload"/>
          <span>{filename||"Choisir un PDF Notability"}</span>
          <input className="sr-only" type="file" accept=".pdf,application/pdf,image/*,.txt,.md,.csv" onChange={importFile}/>
        </label>

        {busy&&<div className="mt-4 rounded-2xl bg-amber-50 border border-amber-200 p-4 text-amber-950 font-bold">
          {busy}
        </div>}

        {course&&<div className="mt-4 rounded-2xl bg-emerald-50 border border-emerald-200 p-4 text-emerald-950 font-bold">
          ✓ Cours importé. Tu peux créer le QCM.
        </div>}

        <div className="mt-5 grid sm:grid-cols-2 gap-4">
          <label className="font-black">2. Nombre de questions
            <select value={count} onChange={e=>setCount(Number(e.target.value))} className="tap mt-2 w-full rounded-xl border border-slate-300 bg-white px-3">
              {[10,15,20,25,30].map(n=><option key={n} value={n}>{n} questions</option>)}
            </select>
          </label>

          <label className="font-black">Titre
            <input value={title} onChange={e=>setTitle(e.target.value.slice(0,70))} className="tap mt-2 w-full rounded-xl border border-slate-300 px-3"/>
          </label>
        </div>

        <button onClick={createQuiz} disabled={!course||!!busy} className="tap mt-6 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black text-lg flex items-center justify-center gap-2">
          <Icon name="wand-sparkles"/> Créer le quiz & le QR
        </button>

        <details className="mt-5 rounded-2xl border border-slate-200 p-4">
          <summary className="cursor-pointer font-black text-sm">Option : voir le texte récupéré</summary>
          <textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-64 rounded-xl border border-slate-300 p-3 text-sm leading-relaxed"></textarea>
        </details>
      </section>

      {library.length>0&&<section className="mt-5 bg-white border border-slate-200 rounded-3xl p-5 shadow-soft">
        <h2 className="text-lg font-black">Mes quiz publiés</h2>
        <div className="mt-4 space-y-3">
          {library.map(item=><div key={item.id} className="rounded-2xl border border-slate-200 p-4">
            <div className="font-black">{item.title}</div>
            <div className="mt-1 text-xs text-slate-500">{item.count} questions · {new Date(item.createdAt).toLocaleString("fr-FR")}</div>
            <button onClick={()=>reopen(item)} className="tap mt-3 w-full rounded-xl bg-indigo-50 text-indigo-900 font-black">Réafficher le QR</button>
          </div>)}
        </div>
      </section>}
    </div>

    <Toast value={toast} onClose={()=>setToast(null)}/>
  </main>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
