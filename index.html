<script type="text/babel">
const {useEffect,useMemo,useRef,useState}=React;

/* =========================================================
   EXEMPLE DE COURS — basé sur un vrai chapitre de maths
========================================================= */
const EXAMPLE_COURSE = `Chapitre : Distributivité et produits remarquables

Définition : Une expression littérale est une expression dans laquelle des nombres sont représentés par des lettres appelées variables.

Définition : Un monôme est une expression littérale qui est le produit d'une partie numérique, appelée coefficient, par une partie littérale composée de lettres.

Définition : La valeur numérique d'une expression littérale est le nombre obtenu en remplaçant les variables par les valeurs données.

Définition : Une expression littérale réduite est une expression littérale qui ne contient plus de termes semblables.

Méthode : Pour réduire une expression littérale, on additionne les termes semblables.
Pour additionner ou soustraire des termes semblables, on recopie leur partie littérale et on additionne ou soustrait leurs coefficients.

Méthode : Pour calculer un produit algébrique de monômes, on multiplie les coefficients entre eux puis les parties littérales entre elles.

Propriété : Distributivité simple.
k(a+b)=ka+kb
k(a-b)=ka-kb

Définition : Développer une expression littérale signifie transformer un produit algébrique en une somme algébrique.

Règle : Pour supprimer des parenthèses précédées d'un signe +, on recopie les termes sans changer leur signe.
Règle : Pour supprimer des parenthèses précédées d'un signe -, on recopie les termes en changeant leur signe.
Règle : Pour supprimer des parenthèses précédées d'un signe de multiplication, on applique la distributivité.

Propriété : Double distributivité.
(a+b)(c+d)=ac+ad+bc+bd

Produit remarquable :
(a+b)²=a²+2ab+b²
Le carré d'une somme est égal à la somme des carrés augmentée du double produit.

Produit remarquable :
(a-b)²=a²-2ab+b²
Le carré d'une différence est égal à la somme des carrés diminuée du double produit.

Produit remarquable :
(a+b)(a-b)=a²-b²
Le produit de deux binômes conjugués est égal à une différence de deux carrés.

Exemple : 3(x+2)=3x+6
Exemple : (x+5)²=x²+10x+25
Exemple : (x-4)²=x²-8x+16
Exemple : (x+3)(x-3)=x²-9`;

/* =========================================================
   OUTILS
========================================================= */
const GOOD=["Bravo !","Bien joué !","Excellent !","Super !","C’est juste !"];

function norm(t){
  return String(t||"")
    .replace(/\r/g,"\n")
    .replace(/[ \t]+/g," ")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function lines(text){
  return norm(text).split("\n").map(x=>x.trim()).filter(Boolean);
}

function cleanLabel(s){
  return s.replace(/^(définition|propriété|méthode|règle|rappel|remarque|attention|produit remarquable|exemple)\s*:\s*/i,"").trim();
}

function parseCourse(text){
  // Le texte issu des PDF/Notability est souvent "aplati" et certains caractères
  // sont mal reconnus (ex. Définition -> DéOinition). On normalise avant analyse.
  const normalized = norm(text)
    .replace(/DéOinition/gi,"Définition")
    .replace(/DeOinition/gi,"Définition")
    .replace(/Propriété/gi,"Propriété")
    .replace(/Définition/gi,"Définition")
    .replace(/Méthode/gi,"Méthode")
    .replace(/Règle/gi,"Règle");

  // Découpe non seulement aux retours ligne, mais aussi avant les marqueurs pédagogiques.
  const expanded = normalized
    .replace(/\s+(Définition\s*:)/gi,"\n$1")
    .replace(/\s+(Propriété\s*:)/gi,"\n$1")
    .replace(/\s+(Méthode\s*:)/gi,"\n$1")
    .replace(/\s+(Règle\s*:)/gi,"\n$1")
    .replace(/\s+(Rappel\s*:)/gi,"\n$1")
    .replace(/\s+(Remarque\s*:)/gi,"\n$1")
    .replace(/\s+(Exemple(?:s)?\s*:)/gi,"\n$1")
    .replace(/\s+(Produit remarquable\s*:)/gi,"\n$1");

  const ls=expanded.split("\n").map(x=>x.trim()).filter(Boolean);
  const items=[];

  for(let i=0;i<ls.length;i++){
    const raw=ls[i];
    let type=null;

    if(/^(définition|definition)\s*:/i.test(raw)) type="definition";
    else if(/^propriété\s*:/i.test(raw)) type="property";
    else if(/^méthode\s*:/i.test(raw)) type="method";
    else if(/^règle\s*:/i.test(raw)) type="rule";
    else if(/^rappel\s*:/i.test(raw)) type="reminder";
    else if(/^produit remarquable\s*:/i.test(raw)) type="identity";
    else if(/^exemples?\s*:/i.test(raw)) type="example";

    // Formules suffisamment explicites, y compris si elles commencent par des lettres.
    const formula = raw.match(/([\(]?[a-zA-Z0-9]+(?:\s*[\+\-]\s*[a-zA-Z0-9]+)+[\)]?²?\s*=\s*[^.;]+)/);
    if(formula && !type) type="formula";

    if(type){
      let content = raw
        .replace(/^(définition|definition|propriété|méthode|règle|rappel|remarque|produit remarquable|exemples?)\s*:\s*/i,"")
        .trim();

      // Si le marqueur est seul, on prend la ligne suivante.
      if(!content && ls[i+1]) content=ls[++i];

      items.push({type,content,raw});
      continue;
    }

    // Rattache les phrases de méthode/propriété qui suivent.
    if(items.length && raw.length<260){
      const prev=items[items.length-1];
      if(["method","rule","property","identity","definition"].includes(prev.type) &&
         /^(pour|on |le |la |les |un |une |quel que|soient|k\(|\(|[a-zA-Z0-9]+\()/i.test(raw)){
        prev.content += " " + raw;
      }
    }
  }

  // MODE DE SECOURS :
  // si peu de blocs formels ont été reconnus, on récupère les phrases porteuses de sens.
  if(items.length<3){
    const sentences = normalized
      .split(/(?<=[.!?])\s+|\n+/)
      .map(s=>s.trim())
      .filter(s=>s.length>=25 && s.length<=240);

    for(const s of sentences){
      if(/est une|est un|signifie|permet de|pour .* il (?:faut|suffit)|on (?:ajoute|recopie|multiplie|applique|additionne|soustrait)|est égal à/i.test(s)){
        const guessed = /est une|est un|signifie/i.test(s) ? "definition" :
                        /pour .* il (?:faut|suffit)|on (?:ajoute|recopie|multiplie|applique|additionne|soustrait)/i.test(s) ? "method" :
                        "property";
        items.push({type:guessed,content:s,raw:s});
      }
    }
  }

  // Déduplication
  const seen=new Set();
  return items.filter(x=>{
    const c=(x.content||"").trim();
    if(c.length<5) return false;
    const k=(x.type+"|"+c.toLowerCase()).slice(0,220);
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

function topicFromDefinition(content){
  const m=content.match(/^(.{2,70}?)\s+(?:est|sont|signifie|désigne|représente|correspond à)\s+(.+)$/i);
  if(!m) return null;
  return {subject:m[1].trim(),definition:m[2].trim()};
}

function distractDefinition(correct, pool){
  const choices=pool.filter(x=>x!==correct && x.length>15 && x.length<150);
  return shuffle([correct,...shuffle(choices).slice(0,3)]).slice(0,4);
}

function makeQuestions(text,count){
  const items=parseCourse(text);
  if(items.length<1) throw new Error("Je n’ai pas réussi à exploiter ce document. Essaie un PDF avec du texte sélectionnable ou une image plus nette.");

  const definitionBodies=items
    .filter(x=>x.type==="definition")
    .map(x=>topicFromDefinition(x.content))
    .filter(Boolean)
    .map(x=>x.definition);

  const qs=[];

  // Définitions
  items.filter(x=>x.type==="definition").forEach((it,idx)=>{
    const d=topicFromDefinition(it.content);
    if(!d) return;
    const opts=distractDefinition(d.definition,definitionBodies);
    if(opts.length>=2){
      qs.push({
        id:"def-"+idx,
        q:`Quelle définition correspond à « ${d.subject} » ?`,
        o:opts,
        a:d.definition,
        x:`${d.subject} ${/^(est|sont)/i.test(d.definition)?"":"est "} ${d.definition}`,
        s:it.content
      });
    }
  });

  // Méthodes/règles
  items.filter(x=>["method","rule"].includes(x.type)).forEach((it,idx)=>{
    let q="Quelle règle faut-il appliquer ?";
    const c=it.content;
    if(/réduire une expression/i.test(c)) q="Comment réduit-on une expression littérale ?";
    else if(/parenthèses.*signe \+/i.test(c)) q="Que fait-on pour supprimer des parenthèses précédées d’un signe + ?";
    else if(/parenthèses.*signe -/i.test(c)) q="Que fait-on pour supprimer des parenthèses précédées d’un signe − ?";
    else if(/produit algébrique/i.test(c)) q="Comment calcule-t-on un produit algébrique de monômes ?";

    const wrongPool=[
      "On change systématiquement tous les signes.",
      "On additionne tous les nombres et toutes les lettres.",
      "On supprime les parenthèses sans modifier l’expression.",
      "On divise les coefficients puis on additionne les lettres."
    ];
    qs.push({
      id:"meth-"+idx,
      q,
      o:shuffle([c,...shuffle(wrongPool).slice(0,3)]),
      a:c,
      x:c,
      s:c
    });
  });

  // Formules exactes
  const formulaPairs=[];
  const sourceLines=lines(text);
  sourceLines.forEach((l,i)=>{
    const m=l.match(/^(.+?)=(.+)$/);
    if(m && /[a-zA-Z]/.test(l) && l.length<90){
      formulaPairs.push({left:m[1].trim(),right:m[2].trim(),raw:l});
    }
  });

  formulaPairs.forEach((f,idx)=>{
    let wrong=[
      f.right.replace(/\+/g,"-"),
      f.right.replace(/-/g,"+"),
      f.right.replace(/2([a-zA-Z])/g,"$1"),
      f.right.replace(/²/g,"")
    ].filter(x=>x!==f.right && x.length>0);

    wrong=[...new Set(wrong)];
    while(wrong.length<3) wrong.push("Aucune de ces expressions");
    qs.push({
      id:"form-"+idx,
      q:`Complète correctement : ${f.left} = …`,
      o:shuffle([f.right,...wrong.slice(0,3)]),
      a:f.right,
      x:`La formule correcte est : ${f.raw}`,
      s:f.raw
    });
  });

  // Exemples calculés
  items.filter(x=>x.type==="example").forEach((it,idx)=>{
    const m=it.content.match(/^(.+?)=(.+)$/);
    if(!m) return;
    const left=m[1].trim(), right=m[2].trim();
    const wrong=[
      right.replace(/\+/g,"-"),
      right.replace(/-/g,"+"),
      right.replace(/\d+/g,n=>String(Number(n)+1))
    ].filter(x=>x!==right);
    qs.push({
      id:"ex-"+idx,
      q:`Quel est le développement correct de ${left} ?`,
      o:shuffle([right,...wrong.slice(0,3)]),
      a:right,
      x:`D’après l’exemple du cours : ${left}=${right}`,
      s:it.content
    });
  });

  // Propriétés en compréhension
  items.filter(x=>["property","identity"].includes(x.type)).forEach((it,idx)=>{
    const c=it.content;
    if(/distributivité simple/i.test(c)){
      qs.push({
        id:"prop-ds-"+idx,
        q:"À quoi sert la distributivité simple dans ce chapitre ?",
        o:shuffle([
          "À transformer un produit en une somme ou une différence.",
          "À calculer uniquement des puissances.",
          "À supprimer les variables.",
          "À transformer une somme en quotient."
        ]),
        a:"À transformer un produit en une somme ou une différence.",
        x:"La distributivité simple permet de développer une expression.",
        s:c
      });
    }
    if(/double distributivité/i.test(c)){
      qs.push({
        id:"prop-dd-"+idx,
        q:"Combien de produits obtient-on lorsqu’on développe (a+b)(c+d) ?",
        o:shuffle(["4","2","3","6"]),
        a:"4",
        x:"On obtient ac + ad + bc + bd, donc quatre produits.",
        s:c
      });
    }
  });

  // Fallback pédagogique : si le document contient peu de blocs balisés,
  // on crée des questions de compréhension à partir des phrases-clés.
  if(qs.length<count){
    const sourceSentences = norm(text)
      .replace(/DéOinition/gi,"Définition")
      .split(/(?<=[.!?])\s+|\n+/)
      .map(s=>s.trim())
      .filter(s=>s.length>=25 && s.length<=220)
      .filter(s=>/est une|est un|signifie|permet de|pour .* il (?:faut|suffit)|on (?:ajoute|recopie|multiplie|applique|additionne|soustrait)|est égal à/i.test(s));

    sourceSentences.forEach((s,i)=>{
      let question="Quelle affirmation est correcte d’après le cours ?";
      if(/pour .* il (?:faut|suffit)/i.test(s)) question="Quelle méthode est correcte d’après le cours ?";
      else if(/est une|est un|signifie/i.test(s)) question="Quelle définition est correcte d’après le cours ?";

      const wrongPool=[
        "Cette affirmation n’apparaît pas dans le cours.",
        "On applique toujours la règle inverse.",
        "On peut effectuer l’opération sans tenir compte des signes."
      ];

      qs.push({
        id:"fallback-"+i,
        q:question,
        o:shuffle([s,...wrongPool]),
        a:s,
        x:`Le cours indique : « ${s} »`,
        s:s
      });
    });
  }

  // Déduplication et sélection
  const seen=new Set();
  const unique=[];
  for(const q of shuffle(qs)){
    if(!seen.has(q.q)){
      seen.add(q.q);
      unique.push(q);
    }
  }

  if(unique.length===0) throw new Error("Je n’ai pas réussi à fabriquer de bonnes questions avec ce document.");

  // Si on en manque, on recycle proprement
  const out=[];
  let i=0;
  while(out.length<count){
    const base=unique[i%unique.length];
    out.push({...base,id:base.id+"-"+i});
    i++;
    if(i>200) break;
  }
  return out.slice(0,count);
}

async function extractPdfText(file,onProgress){
  const ab=await file.arrayBuffer();
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument({data:ab}).promise;
  let out=[];
  for(let p=1;p<=pdf.numPages;p++){
    onProgress(`Lecture du PDF : page ${p}/${pdf.numPages}`);
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    out.push(tc.items.map(x=>x.str).join(" "));
  }
  return norm(out.join("\n"));
}

async function ocrImage(file,onProgress){
  const r=await Tesseract.recognize(file,"fra",{
    logger:m=>{
      if(m.status==="recognizing text") onProgress(`Lecture de l’image : ${Math.round((m.progress||0)*100)} %`);
    }
  });
  return norm(r?.data?.text||"");
}

function shortCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function Icon({name,size=20}){
  const ref=useRef(null);
  useEffect(()=>{
    if(ref.current&&window.lucide){
      ref.current.innerHTML=`<i data-lucide="${name}"></i>`;
      window.lucide.createIcons({attrs:{width:size,height:size,"aria-hidden":"true"}});
    }
  },[name,size]);
  return <span ref={ref} className="inline-flex shrink-0" aria-hidden="true"/>;
}

function Toast({value,onClose}){
  useEffect(()=>{
    if(!value)return;
    const id=setTimeout(onClose,3500);
    return()=>clearTimeout(id);
  },[value]);
  if(!value)return null;
  return <div className="fixed z-50 left-3 right-3 bottom-4 flex justify-center">
    <div className={`max-w-lg w-full rounded-2xl px-4 py-3 shadow-soft border font-semibold flex gap-3 ${
      value.type==="error"?"bg-rose-50 border-rose-200 text-rose-900":
      value.type==="success"?"bg-emerald-50 border-emerald-200 text-emerald-900":
      "bg-white border-slate-200"
    }`}>
      <Icon name={value.type==="error"?"circle-alert":value.type==="success"?"circle-check":"info"}/>
      <span>{value.msg}</span>
    </div>
  </div>
}

function App(){
  const [screen,setScreen]=useState("home");
  const [course,setCourse]=useState(EXAMPLE_COURSE);
  const [count,setCount]=useState(15);
  const [quiz,setQuiz]=useState([]);
  const [title,setTitle]=useState("Quizz Maths");
  const [fileName,setFileName]=useState("");
  const [busy,setBusy]=useState("");
  const [toast,setToast]=useState(null);

  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState("");
  const [answers,setAnswers]=useState({});
  const [feedback,setFeedback]=useState(null);
  const [showCourse,setShowCourse]=useState(false);

  const [publishOpen,setPublishOpen]=useState(false);
  const [publishCode,setPublishCode]=useState("");
  const qrRef=useRef(null);

  const q=quiz[idx];
  const correct=Object.values(answers).filter(x=>x.correct).length;

  async function importFile(e){
    const f=e.target.files?.[0];
    if(!f)return;
    setFileName(f.name);
    try{
      if(f.type==="application/pdf"||f.name.toLowerCase().endsWith(".pdf")){
        setBusy("Lecture du PDF…");
        const text=await extractPdfText(f,setBusy);
        setCourse(text);
        setBusy("");
        setToast({type:"success",msg:"Cours importé. Tu peux générer le quiz."});
        return;
      }
      if(f.type.startsWith("image/")){
        setBusy("Lecture de l’image…");
        const text=await ocrImage(f,setBusy);
        setCourse(text);
        setBusy("");
        setToast({type:"success",msg:"Image lue. Vérifie rapidement le texte puis génère le quiz."});
        return;
      }
      if(f.type.startsWith("text/")||/\.(txt|md|csv)$/i.test(f.name)){
        setCourse(norm(await f.text()));
        setToast({type:"success",msg:"Cours importé."});
        return;
      }
      throw new Error("Utilise un PDF, une image ou un fichier texte.");
    }catch(err){
      setBusy("");
      setToast({type:"error",msg:err.message||"Import impossible."});
    }
  }

  function generate(){
    try{
      const qs=makeQuestions(course,count);
      setQuiz(qs);
      setScreen("preview");
      setToast({type:"success",msg:`${qs.length} questions générées.`});
    }catch(err){
      setToast({type:"error",msg:err.message});
    }
  }

  function start(){
    setIdx(0);
    setSel("");
    setAnswers({});
    setFeedback(null);
    setShowCourse(false);
    setScreen("quiz");
  }

  function validate(){
    if(!sel||!q)return;
    const ok=sel===q.a;
    setAnswers(v=>({...v,[q.id]:{selected:sel,correct:ok}}));
    setFeedback({
      correct:ok,
      msg:ok?GOOD[(idx+correct)%GOOD.length]:`Bonne réponse : ${q.a}`
    });
  }

  function next(){
    if(idx+1>=quiz.length){
      setScreen("results");
      window.scrollTo(0,0);
      return;
    }
    setIdx(i=>i+1);
    setSel("");
    setFeedback(null);
    setShowCourse(false);
  }

  function publish(){
    const code=shortCode();
    setPublishCode(code);
    setPublishOpen(true);
    setTimeout(()=>{
      if(!qrRef.current)return;
      qrRef.current.innerHTML="";
      const base=location.href.split("#")[0];
      const target=base+"#q="+code;
      new QRCode(qrRef.current,{text:target,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
    },50);
  }

  if(screen==="home"){
    return <main className="min-h-screen">
      <header className="bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white">
        <div className="max-w-4xl mx-auto px-4 py-8 sm:py-10">
          <div className="flex gap-4 items-start">
            <div className="w-14 h-14 rounded-2xl bg-white/15 grid place-items-center"><Icon name="sigma" size={30}/></div>
            <div>
              <p className="uppercase tracking-[.2em] text-xs font-black text-indigo-100">Professeur</p>
              <h1 className="text-3xl sm:text-4xl font-black mt-1">Quizz Maths</h1>
              <p className="mt-2 text-indigo-100">Importer → Générer → Tester → Publier.</p>
            </div>
          </div>
        </div>
      </header>

      <div className="max-w-4xl mx-auto px-4 py-6">
        <section className="bg-white border border-slate-200 rounded-3xl p-5 sm:p-7 shadow-soft">
          <h2 className="text-xl font-black">1. Importe ton cours</h2>

          <label className="mt-4 tap w-full border-2 border-dashed border-indigo-300 bg-indigo-50 hover:bg-indigo-100 rounded-2xl px-4 py-6 flex justify-center items-center gap-3 cursor-pointer font-black text-indigo-900">
            <Icon name="upload"/>
            <span>{fileName||"PDF Notability, photo ou fichier"}</span>
            <input className="sr-only" type="file" accept=".pdf,image/*,.txt,.md,.csv" onChange={importFile}/>
          </label>

          {busy&&<div className="mt-4 rounded-2xl bg-amber-50 border border-amber-200 p-4 font-bold text-amber-900">{busy}</div>}

          <div className="mt-5 grid sm:grid-cols-2 gap-4">
            <label className="font-black">Nombre de questions
              <select value={count} onChange={e=>setCount(Number(e.target.value))} className="mt-2 w-full tap rounded-xl border border-slate-300 px-3 bg-white">
                {[10,15,20,25,30].map(n=><option key={n}>{n}</option>)}
              </select>
            </label>
            <label className="font-black">Titre
              <input value={title} onChange={e=>setTitle(e.target.value)} className="mt-2 w-full tap rounded-xl border border-slate-300 px-3"/>
            </label>
          </div>

          <details className="mt-5 rounded-2xl border border-slate-200 p-4">
            <summary className="cursor-pointer font-black">Voir / corriger le texte extrait</summary>
            <textarea value={course} onChange={e=>setCourse(e.target.value)} className="mt-3 w-full min-h-72 rounded-xl border border-slate-300 p-3 leading-relaxed"/>
          </details>

          <button onClick={generate} disabled={!!busy} className="tap mt-5 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black px-5 flex justify-center items-center gap-2">
            <Icon name="sparkles"/> Générer le quiz
          </button>
        </section>

        <section className="mt-5 bg-slate-900 text-white rounded-3xl p-5">
          <h2 className="font-black flex gap-2 items-center"><Icon name="wand-sparkles"/> Nouveau moteur</h2>
          <p className="mt-2 text-sm text-slate-200">Le moteur accepte désormais aussi les PDF Notability imparfaitement lus : il repère les définitions, propriétés, méthodes, règles et formules, puis utilise un mode de secours sur les phrases importantes si nécessaire.</p>
        </section>
      </div>
      <Toast value={toast} onClose={()=>setToast(null)}/>
    </main>
  }

  if(screen==="preview"){
    return <main className="min-h-screen bg-slate-50 px-4 py-6">
      <div className="max-w-4xl mx-auto">
        <button onClick={()=>setScreen("home")} className="tap rounded-xl px-3 font-bold flex gap-2 items-center"><Icon name="arrow-left"/> Retour</button>
        <section className="mt-3 bg-white border border-slate-200 rounded-3xl p-5 sm:p-7 shadow-soft">
          <p className="uppercase tracking-[.18em] text-xs font-black text-indigo-700">Aperçu</p>
          <h1 className="text-2xl sm:text-3xl font-black mt-1">{title}</h1>
          <p className="text-slate-600 mt-2">{quiz.length} questions générées.</p>

          <div className="mt-5 space-y-3">
            {quiz.slice(0,10).map((x,i)=><div key={x.id} className="rounded-2xl border border-slate-200 p-4">
              <div className="font-black">{i+1}. {x.q}</div>
              <div className="mt-2 text-sm text-emerald-800"><strong>Réponse :</strong> {x.a}</div>
            </div>)}
          </div>
          {quiz.length>10&&<p className="mt-3 text-sm text-slate-500">+ {quiz.length-10} autres questions</p>}

          <div className="mt-6 grid sm:grid-cols-2 gap-3">
            <button onClick={start} className="tap rounded-2xl bg-indigo-700 text-white font-black px-4 flex items-center justify-center gap-2"><Icon name="play"/> Tester le quiz</button>
            <button onClick={publish} className="tap rounded-2xl bg-emerald-600 text-white font-black px-4 flex items-center justify-center gap-2"><Icon name="qr-code"/> Publier & QR</button>
          </div>
        </section>
      </div>

      {publishOpen&&<div className="fixed inset-0 bg-slate-950/60 z-40 p-4 flex items-center justify-center">
        <section className="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-soft">
          <h2 className="text-xl font-black">QR élève</h2>
          <div ref={qrRef} className="mt-5 mx-auto w-[240px] min-h-[240px] grid place-items-center"></div>
          <div className="mt-4 rounded-2xl bg-indigo-50 p-4">
            <div className="text-sm text-indigo-700">Code du quiz</div>
            <div className="text-3xl tracking-[.2em] font-black text-indigo-950">{publishCode}</div>
          </div>
          <div className="mt-4 rounded-2xl bg-amber-50 border border-amber-200 p-4 text-left text-sm text-amber-950">
            <strong>Mode test :</strong> le QR est volontairement court, mais il faut maintenant relier l’application à un petit stockage en ligne pour que ce code retrouve le quiz sur le téléphone d’un élève. Sans ce stockage, le QR ne peut pas encore fonctionner entre deux appareils.
          </div>
          <button onClick={()=>setPublishOpen(false)} className="tap mt-5 w-full rounded-xl bg-slate-900 text-white font-black">Fermer</button>
        </section>
      </div>}
      <Toast value={toast} onClose={()=>setToast(null)}/>
    </main>
  }

  if(screen==="quiz"&&q){
    return <main className="min-h-screen bg-slate-50">
      <header className="sticky top-0 bg-white border-b z-20">
        <div className="max-w-2xl mx-auto px-4 py-3">
          <div className="flex justify-between font-bold text-sm"><span>Question {idx+1}/{quiz.length}</span><span>{correct} juste{correct>1?"s":""}</span></div>
          <div className="mt-2 h-2 rounded-full bg-slate-200 overflow-hidden"><div className="h-full bg-indigo-600" style={{width:`${Math.max(5,idx/quiz.length*100)}%`}}/></div>
        </div>
      </header>

      <div className="max-w-2xl mx-auto px-4 py-6">
        <section className="bg-white border border-slate-200 rounded-3xl p-5 sm:p-7 shadow-soft">
          <h1 className="text-xl sm:text-2xl font-black">{q.q}</h1>

          <fieldset className="mt-6 space-y-3" disabled={!!feedback}>
            {q.o.map((o,i)=>{
              const active=sel===o;
              let st=active?"border-indigo-600 bg-indigo-50":"border-slate-200 bg-white";
              if(feedback&&o===q.a)st="border-emerald-600 bg-emerald-50";
              if(feedback&&active&&o!==q.a)st="border-rose-500 bg-rose-50";
              return <label key={i} className={`tap rounded-2xl border-2 p-4 flex gap-3 items-start cursor-pointer font-bold ${st}`}>
                <input type="radio" name="answer" checked={active} onChange={()=>setSel(o)} className="mt-1 w-5 h-5 accent-indigo-700"/>
                <span>{o}</span>
              </label>
            })}
          </fieldset>

          {!feedback?
            <button disabled={!sel} onClick={validate} className="tap mt-5 w-full rounded-2xl bg-indigo-700 disabled:bg-slate-300 text-white font-black px-5">Valider</button>
          :
            <div className={`mt-5 rounded-2xl border p-4 ${feedback.correct?"bg-emerald-50 border-emerald-200 text-emerald-950":"bg-rose-50 border-rose-200 text-rose-950"}`}>
              <div className="font-black">{feedback.msg}</div>
              <p className="mt-2 text-sm"><strong>Explication :</strong> {q.x}</p>
              <button onClick={()=>setShowCourse(v=>!v)} className="tap mt-3 rounded-xl bg-white/80 border border-current/10 px-3 font-black text-sm flex items-center gap-2"><Icon name="book-open" size={17}/> {showCourse?"Masquer le cours":"Voir le cours"}</button>
              {showCourse&&<div className="mt-3 rounded-xl bg-white/70 p-3 text-sm leading-relaxed">{q.s}</div>}
            </div>
          }

          {feedback&&<button onClick={next} className="tap mt-5 w-full rounded-2xl bg-slate-900 text-white font-black px-5">{idx+1===quiz.length?"Voir le bilan":"Question suivante"}</button>}
        </section>
      </div>
    </main>
  }

  const missed=quiz.filter(x=>!answers[x.id]?.correct);
  const percent=quiz.length?Math.round(correct/quiz.length*100):0;
  return <main className="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-indigo-50 px-4 py-6">
    <div className="max-w-3xl mx-auto">
      <section className="bg-white border border-slate-200 rounded-3xl p-6 text-center shadow-soft">
        <div className="w-20 h-20 rounded-full bg-emerald-100 text-emerald-800 mx-auto grid place-items-center"><Icon name="trophy" size={42}/></div>
        <h1 className="text-3xl font-black mt-4">{correct}/{quiz.length}</h1>
        <p className="text-xl font-bold">{percent}%</p>
      </section>
      <section className="mt-5 bg-white border border-slate-200 rounded-3xl p-5 shadow-soft">
        <h2 className="text-xl font-black">À revoir</h2>
        {missed.length===0?<p className="mt-3 text-emerald-800 font-bold">Tout est juste. Bravo !</p>:
          <div className="mt-4 space-y-3">{missed.map((x,i)=><details key={x.id} className="rounded-2xl border border-slate-200 p-4"><summary className="font-black cursor-pointer">{i+1}. {x.q}</summary><p className="mt-2 text-sm"><strong>Bonne réponse :</strong> {x.a}</p><p className="mt-1 text-sm">{x.x}</p></details>)}</div>
        }
      </section>
      <button onClick={start} className="tap mt-5 w-full rounded-2xl bg-indigo-700 text-white font-black">Relancer le quiz</button>
    </div>
  </main>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
